<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a1208">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ölrausch">

<link rel="apple-touch-icon" href="icon-180.png">

<title>Ölrausch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#ffd54a;--gold2:#ffb21a;--goldD:#b87400;--bg:#1a1208}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:'Fredoka',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#c{position:fixed;inset:0;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 16px);text-align:center;overflow-y:auto;touch-action:pan-y}
.ov.center{justify-content:center;background:rgba(10,6,2,.72)}
.ov.bottom{justify-content:flex-end;background:linear-gradient(rgba(0,0,0,0) 0,rgba(0,0,0,.25) 35%,rgba(0,0,0,.7))}
.btn{border:none;border-radius:18px;padding:15px 20px;font-weight:700;font-size:24px;color:#3a2000;background:linear-gradient(#ffe68a,#ffb21a);box-shadow:0 6px 0 var(--goldD),0 12px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.6);margin-top:12px;width:100%;letter-spacing:.5px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--goldD),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.sec{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:17px;padding:13px}
.btn.green{background:linear-gradient(#7bea9e,#2fb865);color:#06301a;box-shadow:0 6px 0 #1b7a40,0 12px 24px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5)}
.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.03)}}
.buy{flex:none;border:none;border-radius:13px;padding:9px 8px;min-width:96px;font-weight:700;font-size:15px;color:#3a2000;background:linear-gradient(#ffe68a,#ffb21a);box-shadow:0 4px 0 var(--goldD),inset 0 1px 0 rgba(255,255,255,.6);line-height:1.1}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--goldD)}
.buy.no{background:#3a2f24;color:#9c8c78;box-shadow:0 4px 0 #261e16}
.buy.max{background:#2f5a3a;color:#bff5cf;box-shadow:none}
.buy.on{background:linear-gradient(#7bea9e,#2fb865);color:#06301a;box-shadow:0 4px 0 #1b7a40}
#hub{position:fixed;inset:0;z-index:10}
.scroll{position:absolute;inset:0;overflow-y:auto;touch-action:pan-y;padding-bottom:calc(env(safe-area-inset-bottom) + 76px);-webkit-overflow-scrolling:touch}
.gap{height:max(31vh,215px);position:relative}
.regchip{position:absolute;left:14px;bottom:10px;background:rgba(15,10,5,.7);padding:6px 12px;border-radius:999px;font-weight:600;font-size:14px}
.regchip b{color:var(--gold)}
.hubtop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;display:flex;gap:7px;align-items:flex-start;z-index:3;pointer-events:none;max-width:460px;margin:0 auto}
.hubtop>*{pointer-events:auto}
.money{flex:1;min-width:0;background:linear-gradient(rgba(30,20,8,.88),rgba(20,13,5,.88));border-radius:16px;padding:7px 12px;text-align:left;box-shadow:0 6px 18px rgba(0,0,0,.3);border:1px solid rgba(255,213,74,.2)}
.money b{display:block;font-size:27px;line-height:1.05;color:var(--gold);text-shadow:0 2px 0 #7a4f00;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money small{font-size:12.5px;opacity:.85;font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gold{background:rgba(25,16,6,.88);border:1px solid rgba(255,213,74,.25);border-radius:14px;padding:9px 10px;font-weight:700;font-size:17px;white-space:nowrap}
.lvl{width:50px;height:50px;border-radius:50%;padding:4px;flex:none;box-shadow:0 4px 12px rgba(0,0,0,.35)}
.lvl>div{width:100%;height:100%;border-radius:50%;background:#20160a;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lvl b{font-size:18px;color:var(--gold)}.lvl small{font-size:8px;opacity:.7;font-weight:600}
.snd{width:38px;height:38px;border-radius:50%;border:none;background:rgba(25,16,6,.85);color:#fff;font-size:17px;flex:none;margin-top:6px}
.panel{max-width:460px;margin:0 auto;background:linear-gradient(#2c1f11,#1c1309 160px);border-radius:26px 26px 0 0;min-height:calc(100vh - max(31vh,215px));padding:16px 14px 22px;box-shadow:0 -12px 30px rgba(0,0,0,.45);border-top:2px solid rgba(255,213,74,.28)}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:4px;background:linear-gradient(rgba(26,18,9,.97),rgba(14,9,4,.99));border-top:1px solid rgba(255,213,74,.15);padding:6px 6px calc(env(safe-area-inset-bottom) + 6px);z-index:4}
.tab{flex:1;max-width:108px;border:none;background:none;color:#a89880;font-size:12px;font-weight:600;padding:5px 0 4px;position:relative;border-radius:12px}
.tab span{display:block;font-size:23px;line-height:1.15}
.tab.on{color:var(--gold);background:rgba(255,213,74,.1)}
.tab.lock{opacity:.45}
.badge{position:absolute;top:1px;right:16%;min-width:17px;height:17px;border-radius:9px;background:#ff4d5e;color:#fff;font-size:11px;font-style:normal;line-height:17px;padding:0 4px;box-shadow:0 0 0 2px #1a1208;animation:pop .4s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}}
.logo{font-size:36px;font-weight:700;line-height:1;color:var(--gold);text-shadow:0 3px 0 #8a4b00,0 8px 20px rgba(0,0,0,.4)}
.logo span{color:#fff;text-shadow:0 3px 0 #444,0 8px 20px rgba(0,0,0,.4)}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.chip{padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.08);font-weight:600;font-size:13.5px}
.chip b{color:var(--gold)}
h3{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:#cdb898;text-align:left;margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
h3 small{letter-spacing:0;text-transform:none;font-size:12px;opacity:.8;text-align:right}
.card{background:linear-gradient(rgba(255,255,255,.07),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:10px;margin-top:8px;text-align:left}
.item{display:flex;align-items:center;gap:10px}
.ic{font-size:27px;width:42px;height:42px;border-radius:12px;background:rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;flex:none}
.tx{flex:1;min-width:0}
.tx b{font-size:15.5px;display:block}
.tx small{font-size:12.5px;opacity:.78;display:block}
.lv{font-size:11.5px;color:var(--gold);font-weight:600}
.pips{display:flex;gap:2px;margin-top:6px}
.pips i{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.pips i.f{background:var(--gold2)}
.bar{height:8px;border-radius:9px;background:rgba(0,0,0,.35);margin-top:5px;overflow:hidden}
.bar>div{height:100%;border-radius:9px;background:linear-gradient(90deg,#ffb21a,#ff6a2a);transition:width .35s}
.mis .t{display:flex;justify-content:space-between;font-size:14.5px;gap:8px}
.mis .t i{font-style:normal;color:var(--gold);font-weight:600;white-space:nowrap}
.mis small{font-size:12px;color:#ffcf8a}
.boosts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bst{border:2px solid transparent;border-radius:14px;background:rgba(255,255,255,.07);color:#fff;padding:7px 2px 6px;font-size:11px;font-weight:600;line-height:1.15}
.bst span{display:block;font-size:24px}
.bst i{display:block;font-style:normal;color:var(--gold);margin-top:2px}
.bst.on{border-color:#5be08f;background:rgba(91,224,143,.15)}
.bst.no{opacity:.45}
.lock{font-size:13px;opacity:.75;padding:10px;text-align:center}
.alb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.alb div{background:rgba(0,0,0,.25);border-radius:12px;padding:6px 2px;font-size:10.5px;font-weight:600;line-height:1.15;min-height:66px;text-align:center}
.alb div span{display:block;font-size:26px;line-height:1.25}
.alb div.no span{filter:brightness(0) opacity(.35)}
.alb div.no{color:#7d6d5a}
.reg{display:flex;align-items:center;gap:10px}
.reg.act{border-color:rgba(91,224,143,.6);background:rgba(91,224,143,.1)}
canvas.chart{width:100%;height:76px;display:block;margin-top:6px;border-radius:10px;background:rgba(0,0,0,.25)}
.lager{height:16px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:8px;position:relative}
.lager div{height:100%;background:linear-gradient(90deg,#3a2a12,#1a1208 40%,#3a2a12);box-shadow:inset 0 2px 0 rgba(255,220,150,.3);transition:width .3s}
.lager span{position:absolute;inset:0;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;color:#ffe6b0}
.warn{color:#ff8a8a;font-weight:600;font-size:13px;margin-top:6px}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;z-index:5;pointer-events:none;text-align:center}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:6px}
.hchip{background:rgba(10,6,2,.6);border-radius:999px;padding:5px 12px;font-weight:600;font-size:16px;white-space:nowrap}
.hchip small{font-size:12px;color:var(--gold);margin-left:6px}
.hchip.st{color:var(--gold);transition:transform .15s}
#pause{pointer-events:auto;border:none;background:rgba(10,6,2,.6);color:#fff;width:38px;height:38px;border-radius:50%;font:700 14px system-ui;flex:none}
.bars{display:flex;gap:8px;margin-top:7px}
.hb{flex:1;background:rgba(10,6,2,.6);border-radius:10px;padding:4px 8px;display:flex;align-items:center;gap:6px;font-size:13px}
.hb .bar{flex:1;margin:0;height:9px}
#fuelB{background:linear-gradient(90deg,#ffcf3a,#ffe98a)}
#durB{background:linear-gradient(90deg,#9fb3c8,#e3eef9)}
.hb.low{animation:blink .5s infinite}
@keyframes blink{50%{background:rgba(200,30,30,.7)}}
#hDepth{font-size:40px;font-weight:700;margin-top:6px;text-shadow:0 3px 0 rgba(0,0,0,.5),0 0 18px rgba(0,0,0,.6);line-height:1}
#hRec{font-size:13px;font-weight:600;opacity:.85;margin-top:2px;text-shadow:0 1px 3px #000}
#hBoost{margin-top:4px;font-size:18px;letter-spacing:3px}
.pop{background:linear-gradient(#33230f,#1c1309);border-radius:24px;padding:18px 16px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.6);border:1px solid rgba(255,213,74,.18)}
.pop.sheet{max-width:440px;border-radius:26px}
.pop .em{font-size:48px;line-height:1.1}
.pop h2{font-size:25px;margin-top:2px}
.lines{margin-top:10px;text-align:left}
.lines>div{display:flex;justify-content:space-between;align-items:center;padding:5px 2px;font-size:15px;border-bottom:1px solid rgba(255,255,255,.07);gap:8px}
.lines>div b{color:var(--gold);white-space:nowrap}
.total{font-size:44px;font-weight:700;color:var(--gold);margin-top:8px;text-shadow:0 3px 0 #7a4f00;line-height:1.1}
.rec{display:inline-block;margin-top:6px;padding:4px 12px;border-radius:999px;background:var(--gold);color:#3a2000;font-weight:700;font-size:13px;animation:pulse .8s infinite}
.hint{margin-top:6px;color:#ffcf8a;font-size:14.5px}
.xp{margin-top:10px;text-align:left;font-size:13px;font-weight:600}
.xp .bar>div{background:linear-gradient(90deg,#8fd3ff,#b388ff);transition:width .8s}
.lvup{margin-top:8px;padding:8px;border-radius:14px;background:linear-gradient(90deg,rgba(179,136,255,.3),rgba(143,211,255,.3));font-weight:600;font-size:15px;animation:pop .5s}
.find{display:inline-block;margin:6px 3px 0;padding:4px 9px;border-radius:10px;background:rgba(159,240,255,.14);font-size:13px;font-weight:600}
.row2{display:flex;gap:8px;align-items:flex-end}.row2 .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-20px);opacity:0;transition:all .3s;z-index:60;background:linear-gradient(90deg,#3ddc84,#1fb36b);color:#fff;font-weight:600;padding:10px 16px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:14.5px;max-width:92vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:linear-gradient(90deg,#ff6a6a,#d8475a)}
.streak7{display:flex;gap:5px;justify-content:center;margin:10px 0 4px}
.streak7 span{width:34px;height:40px;border-radius:9px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;line-height:1.15}
.streak7 span.on{background:var(--gold);color:#3a2000}
.cd{height:6px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:12px;overflow:hidden}
.cd div{height:100%;background:#ff6a3a;width:100%}
.fly{position:fixed;z-index:70;font-size:22px;pointer-events:none;transition:all .7s cubic-bezier(.5,-0.3,.7,1)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hrow"><div class="hchip">🛢 <b id="hBar">0</b><small id="hVal"></small></div><div class="hchip st" id="hStreak">Serie ×1,0</div><button id="pause">❚❚</button></div>
  <div class="bars"><div class="hb" id="hbF">⛽<div class="bar"><div id="fuelB" style="width:100%"></div></div></div><div class="hb" id="hbD">🔩<div class="bar"><div id="durB" style="width:100%"></div></div></div></div>
  <div id="hDepth">0 m</div><div id="hRec"></div><div id="hBoost"></div>
</div>
<div id="toast"></div>

<div id="hub" class="hidden">
  <div class="scroll" id="hubScroll">
    <div class="gap"><div class="regchip" id="regChip"></div></div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="hubtop">
    <div class="money"><b id="uMoney">$0</b><small id="uSub"></small></div>
    <div class="gold" id="uGold">🪙 0</div>
    <div class="lvl" id="uLvl"><div><b id="uLv">1</b><small>LEVEL</small></div></div>
    <button class="snd" id="bSound">🔊</button>
  </div>
  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="drill"><span>⛏️</span>Bohren<i class="badge hidden"></i></button>
    <button class="tab" data-tab="shop"><span>🔧</span>Werkstatt<i class="badge hidden"></i></button>
    <button class="tab" data-tab="field"><span>🏭</span>Ölfeld<i class="badge hidden"></i></button>
    <button class="tab" data-tab="ach"><span>🏆</span>Erfolge<i class="badge hidden"></i></button>
  </nav>
</div>

<div id="sum" class="ov bottom hidden"><div class="pop sheet" id="sumBox"></div></div>

<div id="rev" class="ov center hidden">
  <div class="pop">
    <div class="em" id="revEm">🔧</div><h2 id="revT">Notreparatur?</h2>
    <div class="hint">Bohrkopf und Diesel wieder auf 60 % – einfach weiterbohren!</div>
    <button class="btn green" id="bRev">REPARIEREN · 3 🪙</button>
    <button class="btn sec" id="bRevNo">Nein, Bohrung beenden</button>
    <div class="cd"><div id="revCd"></div></div>
  </div>
</div>

<div id="pauseOv" class="ov center hidden">
  <div class="pop"><h2>Pause</h2><button class="btn" id="bResume">WEITER</button><button class="btn sec" id="bQuit">Bohrung beenden</button></div>
</div>

<div id="info" class="ov center hidden">
  <div class="pop"><div class="em" id="iEm">🎁</div><h2 id="iT"></h2><div id="iB"></div><button class="btn" id="bInfo">OK</button></div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,U=1;
const texCache={};
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';U=Math.max(.75,Math.min(1.4,Math.min(W/400,H/720)))}
addEventListener('resize',()=>{resize();for(const k in texCache)delete texCache[k]});
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const TAU=Math.PI*2;
const dez=(v,d=1)=>v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d});
function big(n){n=Math.floor(n);const a=Math.abs(n);if(a<1e4)return n.toLocaleString('de-DE');for(const[v,s]of[[1e15,' Brd.'],[1e12,' Bio.'],[1e9,' Mrd.'],[1e6,' Mio.'],[1e3,'K']])if(a>=v)return(n/v).toLocaleString('de-DE',{maximumFractionDigits:a/v<10?2:a/v<100?1:0})+s;return''+n}
const fmt=n=>'$'+big(n);
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}

/* ================= DATEN ================= */
const UPS=[
 {id:'tank',ic:'⛽',n:'Diesel-Tank',d:'Längere Bohrzeit',base:1500,v:l=>16+2.5*l,f:v=>dez(v,0)+' s'},
 {id:'bit',ic:'🔩',n:'Bohrkopf',d:'Hält mehr Felsen aus',base:1700,v:l=>100+25*l,f:v=>'Härte '+v},
 {id:'motor',ic:'⚙️',n:'Motor',d:'Schneller & wendiger',base:2300,v:l=>30+2*l,f:v=>dez(v,0)+' m/s'},
 {id:'pump',ic:'🛢️',n:'Ölpumpe',d:'Mehr Barrel pro Blase',base:2000,v:l=>1+.15*l,f:v=>'×'+dez(v,2)},
 {id:'radar',ic:'🔦',n:'Scheinwerfer',d:'Weiter sehen, Öl erspüren',base:1300,v:l=>190+12*l,f:v=>'Sicht '+v},
];
const MAXL=30,UPG=1.75;
const upCost=(u,l)=>Math.round(u.base*Math.pow(UPG,l)/10)*10;

const L_TX=[
 {d:0,n:'Mutterboden',c:'#5e3b1f',s:'#3f2612',h:'#7a5232',st:'soil'},
 {d:120,n:'Sand',c:'#b88d52',s:'#94703c',h:'#d4ae74',st:'sand'},
 {d:300,n:'Lehm',c:'#8e4f31',s:'#6c3920',h:'#a8664a',st:'clay'},
 {d:550,n:'Kalkstein',c:'#a69f87',s:'#7f7964',h:'#c4bea8',st:'lime'},
 {d:850,n:'Schiefer',c:'#4a505b',s:'#33373f',h:'#69707c',st:'shale'},
 {d:1250,n:'Salzstock',c:'#cfc8bc',s:'#a9a194',h:'#f0ebe4',st:'salt'},
 {d:1750,n:'Granit',c:'#6b5862',s:'#4a3c43',h:'#9a8590',st:'granite'},
 {d:2400,n:'Tiefengestein',c:'#3a2430',s:'#28161f',h:'#5a3a4a',st:'deep'},
 {d:3200,n:'Magma-Zone',c:'#3a120a',s:'#250a05',h:'#ff6a2a',st:'magma'},
];
const L_DS=[
 {d:0,n:'Wüstensand',c:'#e0b46c',s:'#c4964f',h:'#f2d095',st:'sand'},
 {d:100,n:'Dünenstein',c:'#c9894a',s:'#a86c35',h:'#e0a66a',st:'lime'},
 {d:280,n:'Roter Sandstein',c:'#a8502e',s:'#83391e',h:'#c4704c',st:'shale'},

function tex(ri,li){
 const k=ri+'-'+li;if(texCache[k])return texCache[k];
 const L=REG[ri].L[li],TS=512,c=document.createElement('canvas');c.width=c.height=TS;
 const x=c.getContext('2d');x.scale(DPR,DPR);const tw=TS/DPR,r=mulberry(hash(L.n+L.c+ri));
 const R=(a,b)=>a+r()*(b-a);
 const wrap=fn=>{for(const ox of[-tw,0,tw])for(const oy of[-tw,0,tw]){x.save();x.translate(ox,oy);fn();x.restore()}};
 x.fillStyle=L.c;x.fillRect(0,0,tw,tw);
 for(let i=0;i<1100;i++){x.fillStyle=r()<.5?'rgba(0,0,0,.09)':'rgba(255,255,255,.06)';const s=R(.6,2);x.fillRect(r()*tw,r()*tw,s,s)}
 const pebble=(px,py,rr,col,hl)=>{const e=R(.6,.9),ro=R(0,3);wrap(()=>{x.fillStyle=col;x.beginPath();x.ellipse(px,py,rr,rr*e,ro,0,TAU);x.fill();x.fillStyle=hl;x.beginPath();x.ellipse(px-rr*.3,py-rr*.3,rr*.35,rr*.25,0,0,TAU);x.fill()})};
 const line=(pts,col,w,blur)=>wrap(()=>{x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';if(blur){x.shadowColor=col;x.shadowBlur=blur}x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.shadowBlur=0});
 const crack=(n,len)=>{let px=r()*tw,py=r()*tw,a=R(0,TAU);const pts=[[px,py]];for(let i=0;i<n;i++){a+=R(-.8,.8);px+=Math.cos(a)*len;py+=Math.sin(a)*len;pts.push([px,py])}return pts};
 const wavyH=(y,amp,k)=>{const pts=[];for(let i=0;i<=40;i++){const xx=i/40*tw;pts.push([xx,y+Math.sin(xx/tw*TAU*k)*amp])}return pts};
 switch(L.st){
  case'soil':for(let i=0;i<45;i++)pebble(r()*tw,r()*tw,R(1.5,4.5),L.s,'rgba(255,255,255,.12)');for(let i=0;i<7;i++)line(crack(6,R(5,9)),'rgba(25,12,4,.35)',R(.8,1.6));break;
  case'sand':for(let i=0;i<1500;i++){x.fillStyle=r()<.5?L.s:L.h;x.globalAlpha=.55;x.fillRect(r()*tw,r()*tw,1.2,1.2)}x.globalAlpha=1;for(let i=0;i<5;i++)line(wavyH(r()*tw,R(2,5),1+Math.floor(r()*3)),'rgba(0,0,0,.08)',R(1.5,3));for(let i=0;i<10;i++)pebble(r()*tw,r()*tw,R(1.5,3),L.s,'rgba(255,255,255,.2)');break;
  case'clay':for(let i=0;i<16;i++){const px=r()*tw,py=r()*tw,rr=R(10,26);wrap(()=>{const gg=x.createRadialGradient(px,py,0,px,py,rr);gg.addColorStop(0,L.s+'aa');gg.addColorStop(1,L.s+'00');x.fillStyle=gg;x.beginPath();x.arc(px,py,rr,0,TAU);x.fill()})}for(let i=0;i<30;i++)pebble(r()*tw,r()*tw,R(1.5,4),L.h,'rgba(255,255,255,.18)');break;
  case'lime':for(let i=0;i<6;i++){const y=r()*tw,h=R(4,12),k=1+Math.floor(r()*2),col=(i%2?L.s:L.h)+'66';wrap(()=>{x.fillStyle=col;x.beginPath();for(let j=0;j<=40;j++){const xx=j/40*tw;x.lineTo(xx,y+Math.sin(xx/tw*TAU*k)*4)}for(let j=40;j>=0;j--){const xx=j/40*tw;x.lineTo(xx,y+h+Math.sin(xx/tw*TAU*k)*4)}x.fill()})}
   for(let i=0;i<9;i++){const px=r()*tw,py=r()*tw,rr=R(3,6);wrap(()=>{x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=1.2;x.beginPath();for(let a=0;a<12;a+=.3)x.lineTo(px+Math.cos(a)*rr*a/12,py+Math.sin(a)*rr*a/12);x.stroke()})}break;
  case'shale':for(let i=0;i<30;i++)line(wavyH(r()*tw,R(.5,2.5),1+Math.floor(r()*2)),i%2?L.s+'cc':L.h+'88',R(.7,2.2));for(let i=0;i<4;i++)line(crack(5,R(5,8)),'rgba(0,0,0,.3)',1);break;
  case'salt':for(let i=0;i<38;i++){const px=r()*tw,py=r()*tw,rr=R(4,12),n=4+Math.floor(r()*3),rot=R(0,3);wrap(()=>{x.fillStyle=L.h+'99';x.strokeStyle='rgba(255,255,255,.55)';x.lineWidth=1;x.beginPath();for(let j=0;j<n;j++){const a=rot+j/n*TAU;x.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr*.8)}x.closePath();x.fill();x.stroke()})}break;
  case'granite':{const cols=[L.s,'#1a1414',L.h,'#c08a8a','#e8e0d8'];for(let i=0;i<1700;i++){x.fillStyle=cols[Math.floor(r()*cols.length)];x.globalAlpha=R(.4,.9);const s=R(1,3.2);x.fillRect(r()*tw,r()*tw,s,s)}x.globalAlpha=1;break}
  case'deep':for(let i=0;i<10;i++)line(crack(8,R(6,10)),'rgba(0,0,0,.45)',R(1,2));for(let i=0;i<40;i++){x.fillStyle='rgba(255,220,255,.35)';x.fillRect(r()*tw,r()*tw,1.2,1.2)}break;
  case'magma':for(let i=0;i<9;i++)line(crack(9,R(6,11)),'#ff6a1a',R(1.5,3),8);for(let i=0;i<20;i++){x.fillStyle='rgba(255,170,60,.5)';x.beginPath();x.arc(r()*tw,r()*tw,R(1,2.5),0,TAU);x.fill()}break;
  case'water':for(let i=0;i<22;i++){const px=r()*tw,py=r()*tw,rr=R(1.5,4);wrap(()=>{x.strokeStyle='rgba(255,255,255,.22)';x.lineWidth=1;x.beginPath();x.arc(px,py,rr,0,TAU);x.stroke()})}for(let i=0;i<6;i++)line(wavyH(r()*tw,3,2),'rgba(255,255,255,.05)',4);break;
  case'ice':for(let i=0;i<20;i++){const px=r()*tw,py=r()*tw,rr=R(8,22),ro=R(0,3);wrap(()=>{x.fillStyle='rgba(255,255,255,.12)';x.beginPath();x.ellipse(px,py,rr,rr*.5,ro,0,TAU);x.fill()})}for(let i=0;i<12;i++)line(crack(5,R(6,12)),'rgba(255,255,255,.55)',R(.7,1.4));break;
  case'snow':for(let i=0;i<500;i++){x.fillStyle=r()<.5?'rgba(150,180,210,.35)':'rgba(255,255,255,.9)';x.fillRect(r()*tw,r()*tw,1.5,1.5)}break;
 }
 const p=ctx.createPattern(c,'repeat');texCache[k]=p;return p;
}

let G=null,state='hub',paused=false,TT=0;

const PPM=()=>3*U;
const CH=()=>600*U;
const layerIdx=(Ls,m)=>{let i=0;for(let k=0;k<Ls.length;k++)if(m>=Ls[k].d)i=k;return i};

function newWorld(){
 G={reg:S.reg,objs:[],chunks:0,parts:[],texts:[],pipe:[],cam:G?G.cam:-H*.3,shake:0,flash:0,dmg:0,t:0,mode:'idle',d:{x:W/2,y:0,ang:0,spin:0},
  barrels:0,pockets:0,treasure:0,tCount:0,finds:[],newFinds:[],streak:0,maxStreak:0,fuel:1,maxFuel:1,dur:1,maxDur:1,inRock:false,layer:0,endT:0,why:'',maxDepth:0,revived:false,inv:0,boost:{},fountain:0,banner:null,hitStop:0,oilMult:1,speed:1,vis:200};
}
function genChunk(){
 const R=REG[G.reg],k=G.chunks++,y0=k*CH(),y1=y0+CH(),dm=(y0+y1)/2/PPM(),ppm=PPM();
 const minY=Math.max(y0,((R.water||0)+12)*ppm,95*U);
 const placed=[];
 function place(type,r,extra){
  if(minY>=y1)return null;
  for(let a=0;a<16;a++){
   const x=rand(r+8,W-r-8),y=rand(minY,y1);
   if(placed.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+r+14*U))continue;
   const o=Object.assign({type,x,y,r,alive:true,ph:rand(0,TAU),dying:0},extra||{});
   if(type==='rock'){o.pts=[];for(let i=0;i<10;i++)o.pts.push(rand(.78,1.08));o.cr=[];for(let i=0;i<3;i++)o.cr.push([rand(0,TAU),rand(.3,.75)])}
   if(type==='oil'){o.pts=[];for(let i=0;i<12;i++)o.pts.push(rand(.9,1.08))}
   placed.push(o);G.objs.push(o);return o;
  }
  return null;
 }
 const oilN=2+(Math.random()<.6?1:0)+(dm>600?1:0);
 for(let i=0;i<oilN;i++)place('oil',rand(15,32)*U*(1+Math.min(dm,3000)/5000));
 if(Math.random()<.07){const o=place('oil',rand(38,46)*U);if(o)o.giant=true}
 const rockN=Math.min(9,Math.round((1+dm/160+(Math.random()<.5?1:0))*R.rock));
 for(let i=0;i<rockN;i++)place('rock',rand(18,42)*U*(1+Math.min(dm,2000)/4000));
 const gasN=dm<220?0:Math.min(4,Math.floor(rand(0,1.6+dm/700)*R.gas));
 for(let i=0;i<gasN;i++)place('gas',rand(15,22)*U);
 if(Math.random()<.4)place('fuel',13*U);
 if(Math.random()<.38){
  const pool=ALBUM.filter(a=>a.d<=dm);let tot=pool.reduce((s,a)=>s+a.w,0),q=Math.random()*tot,it=pool[0];
  for(const a of pool){q-=a.w;if(q<=0){it=a;break}}
  place('treasure',15*U,{it});
 }
 if(R.water)for(let i=0;i<5;i++){const y=rand(10*ppm,(R.water-8)*ppm);if(y>=y0&&y<y1)G.objs.push({type:'fish',x:rand(0,W),y,r:0,alive:true,vx:rand(20,50)*U*(Math.random()<.5?-1:1),ph:rand(0,TAU),c:['#ffb347','#7fd4ff','#ffd54a'][i%3]})}
}

function startRun(){
 ac();refill();
 if(S.lvl<BOOST_LV)S.sel={};
 const boost={};
 for(const b of BOOST)if(S.sel[b.id]){if(S.gold>=b.c){S.gold-=b.c;boost[b.id]=1}else delete S.sel[b.id]}
 S.sel={};
 newWorld();G.boost=boost;G.mode='run';
 G.maxFuel=G.fuel=uv('tank')*(boost.turbo?1.5:1);G.maxDur=G.dur=uv('bit');
 G.speed=uv('motor')*PPM();G.pumpMult=uv('pump');G.vis=uv('radar')*U;
 G.oilMult=G.pumpMult*lvlMult()*albumMult()*REG[G.reg].mult*(boost.double?2:1);
 while(G.chunks<3)genChunk();

function hitOil(o){

 G.streak++;G.maxStreak=Math.max(G.maxStreak,G.streak);G.pockets++;

 addText(o.x,o.y-o.r-10*U,`+${big(b)} Barrel`,'#ffd54a',o.giant?28:22);
 if(G.streak>=2)addText(o.x,o.y-o.r-36*U,`SERIE ×${dez(streakMult())}`,'#ff9f43',18);

  G.flash=o.giant?.3:.1;

 o.alive=false;o.dying=1;

 if(G.inv<=0)G.dur-=dmg;
 if(G.streak>=2)addText(G.d.x,G.d.y-50*U,'Serie weg','#ff8a8a',18);
 G.streak=0;setStreakHud();
 G.shake=16;G.dmg=.5;sfx.boom();buzz([80,30,80]);
 addText(o.x,o.y-30*U,'GAS! −'+dmg,'#ff6a3a',24);
 if(!SIM)for(let i=0;i<46;i++){const a=rand(0,TAU),s=rand(80,400)*U;G.parts.push({x:o.x,y:o.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:0,life:rand(.3,.8),ml:.8,col:['#ffd54a','#ff9f43','#ff5e3a','#fff','#b6d93a'][i%5],sz:rand(3,9)*U,add:1})}
}
function pickup(o){
 o.alive=false;o.dying=1;
 if(o.type==='fuel'){G.fuel=Math.min(G.maxFuel+6,G.fuel+4);sfx.fuel();addText(o.x,o.y-20*U,'+4 s Diesel','#ffcf3a',20);buzz(10)}
 else{
  const it=o.it,dm=o.y/PPM(),v=Math.round(it.v*(1+dm/600)*REG[G.reg].mult/10)*10;

  addText(o.x,o.y-22*U,it.e+' +'+fmt(v),'#9ff0ff',20);
  mProg('treasure',1,true);
 }
 if(!SIM)for(let i=0;i<14;i++){const a=rand(0,TAU),s=rand(60,220)*U;G.parts.push({x:o.x,y:o.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:0,life:.6,ml:.6,col:'#fff3b0',sz:rand(2,4)*U,add:1})}
}

function endRun(why){
 if(G.mode!=='run')return;

 S.gold-=REV_COST;G.revived=true;G.dur=Math.max(G.dur,G.maxDur*.6);G.fuel=Math.max(G.fuel,G.maxFuel*.6);G.inv=1.5;

/* ---------- Update ---------- */
function update(dt){
 TT+=dt;
 if(G.hitStop>0){G.hitStop-=dt;dt*=.15}
 G.t+=dt;
 const D=G.d,R=REG[G.reg];
 if(G.mode==='run'){
  let tgt=0;
  if(touch.on)tgt=clamp((touch.x-D.x)/(W*.2),-1,1)*1.2;
  const tr=2.4+.1*S.up.motor;
  D.ang+=clamp(tgt-D.ang,-tr*dt,tr*dt);
  const dm0=D.y/PPM(),inWater=R.water&&dm0<R.water;
  const sp=G.speed*(G.inRock?.33:1)*(inWater?1.6:1);
  D.x+=Math.sin(D.ang)*sp*dt;D.y+=Math.cos(D.ang)*sp*dt;
  D.x=clamp(D.x,10*U,W-10*U);D.spin+=dt*(G.inRock?8:22);
  const lp=G.pipe[G.pipe.length-1];
  if(!lp||Math.hypot(lp.x-D.x,lp.y-D.y)>7*U)G.pipe.push({x:D.x,y:D.y});
  while(G.chunks*CH()<D.y+H*1.5)genChunk();
  if(G.inv>0)G.inv-=dt;
  const wasRock=G.inRock;G.inRock=false;
  const magR=G.boost.magnet?110*U:0;
  for(const o of G.objs){
   if(!o.alive||o.type==='fish')continue;
   if(Math.abs(o.y-D.y)>o.r+30*U+magR)continue;
   const d=Math.hypot(o.x-D.x,o.y-D.y);
   if(o.type==='rock'){if(d<o.r*.88)G.inRock=true}
   else if(o.type==='oil'){if(d<o.r+3*U)hitOil(o);else if(magR&&d<o.r+magR){const k=Math.min(1,180*U*dt/d);o.x+=(D.x-o.x)*k;o.y+=(D.y-o.y)*k}}
   else if(o.type==='gas'){if(d<o.r+3*U)hitGas(o)}
   else if(d<o.r+12*U)pickup(o);
  }
  if(G.inRock){
   if(G.inv<=0)G.dur-=55*(1+dm0/2000)*(G.boost.armor?.4:1)*dt;
   G.shake=Math.max(G.shake,3);G.dmg=Math.max(G.dmg,.22);
   if(!wasRock){if(G.streak>=2)addText(D.x,D.y-30*U,'Serie weg','#ff8a8a',18);G.streak=0;setStreakHud();buzz(30)}
   if(!SIM&&Math.random()<dt*45){const a=rand(0,TAU),s=rand(100,280)*U;G.parts.push({x:D.x,y:D.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,g:300*U,life:.35,ml:.35,col:Math.random()<.5?'#ffd54a':'#ff9f43',sz:2.5*U,add:1})}
  }else if(!SIM&&Math.random()<dt*28){
   const L=R.L[G.layer],a=rand(-2.6,-.5),s=rand(40,130)*U;
   G.parts.push({x:D.x,y:D.y,vx:Math.cos(a)*s*(Math.random()<.5?-1:1),vy:Math.sin(a)*s,g:inWater?-60*U:400*U,life:.5,ml:.5,col:inWater?'rgba(255,255,255,.6)':L.s,sz:rand(2,4)*U,round:inWater?1:0});
  }
  humSet(sp/U,G.inRock);
  G.fuel-=dt;
  const dm=D.y/PPM();
  G.maxDepth=Math.max(G.maxDepth,dm);mProg('depth',Math.floor(dm));
  const li=layerIdx(R.L,dm);
  if(li>G.layer){G.layer=li;if(!G.banner||G.banner.t>1.5)G.banner={t:0,txt:R.L[li].n,sub:`${R.L[li].d} m · mehr Öl pro Blase`};sfx.layer()}
  if(!SIM){
   if(G.fuel<G.maxFuel*.2&&Math.floor(G.fuel*3)!==Math.floor((G.fuel+dt)*3))sfx.tick();
   $('fuelB').style.width=clamp(G.fuel/G.maxFuel*100,0,100)+'%';
   $('durB').style.width=clamp(G.dur/G.maxDur*100,0,100)+'%';
   $('hbF').classList.toggle('low',G.fuel<G.maxFuel*.2);$('hbD').classList.toggle('low',G.dur<G.maxDur*.25);
   const best=S.bestR[G.reg]||0;$('hDepth').textContent=Math.max(0,Math.floor(dm))+' m';
   if(best&&dm>best){$('hRec').textContent='🏆 NEUER REKORD!';$('hRec').style.color='#ffd54a'}
  }
  if(G.dur<=0)endRun('Bohrkopf kaputt');
  else if(G.fuel<=0)endRun('Diesel leer');
 }else if(G.mode==='end'){
  G.endT+=dt;if(G.endT>1.5&&state==='play'&&!SIM)showSummary();
 }
 if(SIM)return;
 for(const o of G.objs)if(o.type==='fish'){o.x+=o.vx*dt;if(o.x<-30)o.x=W+30;if(o.x>W+30)o.x=-30}
 let tgtCam=-H*.3;
 if(G.mode==='run'||(G.mode==='end'&&G.endT<.6))tgtCam=D.y-H*.4;
 G.cam+=(tgtCam-G.cam)*Math.min(1,dt*(G.mode==='run'?6:3.2));
 for(const o of G.objs)if(o.dying)o.dying=Math.max(0,o.dying-dt*2.5);
 if(G.mode==='run')G.objs=G.objs.filter(o=>o.y+o.r>G.cam-80);
 if(G.fountain>0||state==='sum'){
  G.fountain=Math.max(0,G.fountain-dt);
  const n=Math.max(1,Math.round(dt*90));const top=R.kind==='sea'?-36*U:-6*U;
  for(let i=0;i<n;i++)G.parts.push({x:W/2+rand(-4,4)*U,y:top-110*U,vx:rand(-90,90)*U,vy:rand(-420,-250)*U,g:520*U,life:rand(1,1.6),ml:1.6,col:Math.random()<.75?'#120a04':'#4a3418',sz:rand(3,7)*U,round:1});
 }
 for(const q of G.parts){q.vy+=(q.g||0)*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}
 G.parts=G.parts.filter(q=>q.life>0);
 if(G.parts.length>700)G.parts.splice(0,G.parts.length-700);
 for(const t of G.texts){t.y-=36*U*dt;t.life-=dt}
 G.texts=G.texts.filter(t=>t.life>0);
 G.shake*=Math.pow(.01,dt);G.flash=Math.max(0,G.flash-dt);G.dmg=Math.max(0,G.dmg-dt);
 if(G.banner){G.banner.t+=dt;if(G.banner.t>2.4)G.banner=null}
}

/* ================= ZEICHNEN ================= */
function wave(Ls,i,x){if(i===0)return 0;return Ls[i].d*PPM()+9*U*Math.sin(x/W*TAU*1.3+i*1.9)+4*U*Math.sin(x/W*TAU*3.7+i*.7)}
function drawSky(sy){
 if(sy<=0)return;
 const R=REG[G.reg];
 const g=ctx.createLinearGradient(0,sy-H*.9,0,sy);g.addColorStop(0,R.sky[0]);g.addColorStop(1,R.sky[1]);
 ctx.fillStyle=g;ctx.fillRect(0,0,W,sy);
 if(R.kind==='snow'){
  for(let i=0;i<3;i++){ctx.globalAlpha=.18+.08*Math.sin(TT*.7+i);ctx.strokeStyle=['#5bffb0','#7fd4ff','#b388ff'][i];ctx.lineWidth=18*U;ctx.beginPath();for(let x=0;x<=W;x+=W/20)ctx.lineTo(x,sy-H*.55+i*14*U+Math.sin(x/W*6+TT*.5+i)*18*U);ctx.stroke()}
  ctx.fillStyle='#fff';for(let i=0;i<40;i++){ctx.globalAlpha=.5+.5*Math.sin(TT*2+i);ctx.fillRect((i*97)%W,(sy-H*.9)+((i*53)%Math.max(1,Math.floor(H*.5))),1.5,1.5)}ctx.globalAlpha=1;
 }else{
  const sx=W*.8,syy=sy-H*.22;const sg=ctx.createRadialGradient(sx,syy,0,sx,syy,70*U);sg.addColorStop(0,'rgba(255,250,210,1)');sg.addColorStop(.35,'rgba(255,240,170,.9)');sg.addColorStop(1,'rgba(255,240,170,0)');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,syy,70*U,0,TAU);ctx.fill();
  for(const c of clouds){const cx=((c.x+TT*c.v)%1.6-.3)*W,cy=sy-H*.5+c.y*H*.25,s=c.s*U;
   ctx.fillStyle=R.kind==='desert'?'rgba(255,240,220,.75)':'rgba(255,255,255,.88)';ctx.beginPath();ctx.arc(cx,cy,22*s,0,TAU);ctx.arc(cx+24*s,cy+4*s,17*s,0,TAU);ctx.arc(cx-24*s,cy+5*s,15*s,0,TAU);ctx.arc(cx+8*s,cy-10*s,16*s,0,TAU);ctx.fill()}
 }
 if(R.kind==='sea'){ctx.fillStyle='#4e7290';ctx.beginPath();ctx.moveTo(0,sy);for(let x=0;x<=W;x+=W/6)ctx.lineTo(x,sy-14*U-8*U*Math.sin(x/W*5));ctx.lineTo(W,sy);ctx.fill();return}
 ctx.fillStyle=R.hills[0];ctx.beginPath();ctx.moveTo(0,sy);for(let x=0;x<=W;x+=W/10)ctx.lineTo(x,sy-40*U-20*U*Math.sin(x/W*5+2));ctx.lineTo(W,sy);ctx.fill();
 ctx.fillStyle=R.hills[1];ctx.beginPath();ctx.moveTo(0,sy);for(let x=0;x<=W;x+=W/12)ctx.lineTo(x,sy-18*U-14*U*Math.sin(x/W*8+1));ctx.lineTo(W,sy);ctx.fill();
}
function drawGround(){
 const R=REG[G.reg],Ls=R.L,ppm=PPM(),top=G.cam-30,bot=G.cam+H+30;
 if(bot<0)return;
 for(let i=0;i<Ls.length;i++){
  const y0=Ls[i].d*ppm,y1=i+1<Ls.length?Ls[i+1].d*ppm:1e9;
  if(y0-20*U>bot)break;if(y1+20*U<top)continue;
  const yb=Math.min(y1+24*U,bot);
  ctx.beginPath();ctx.moveTo(0,yb);

const queue=[];
function info(em,title,html,btn,cb){queue.push({em,title,html,btn,cb})}
function nextInfo(){const q=queue.shift();if(!q){openHub();return}$('iEm').textContent=q.em;$('iT').textContent=q.title;$('iB').innerHTML=q.html;$('bInfo').textContent=q.btn;$('bInfo').onclick=()=>{ac();q.cb&&q.cb();save();sfx.cash();nextInfo()};show('info')}
function dayStr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function idleTick(sec){const cap=lagerCap(S.lagerLv);if(S.pumps&&S.lager<cap)S.lager=Math.min(cap,S.lager+pumpRate()*sec)}
function checkStart(){
 const now=Date.now(),away=Math.max(0,(now-S.seen)/1000);
 if(S.pumps>0&&away>60){
  const before=S.lager;idleTick(away);const got=S.lager-before,cap=lagerCap(S.lagerLv);
  if(got>=1){const tm=away>=3600?Math.floor(away/3600)+' h '+Math.floor(away%3600/60)+' min':Math.floor(away/60)+' min';
   info('🛢️','Willkommen zurück!',`<div class="hint">Deine ${S.pumps} Pumpe${S.pumps>1?'n haben':' hat'} in ${tm} gefördert:</div><div class="total">+${big(got)} Barrel</div><div class="hint">Lagerwert jetzt ca. ${fmt(S.lager*oilPrice().p)}</div>${S.lager>=cap-.5?'<div class="warn">⚠️ Dein Lager ist voll! Verkaufen oder ausbauen.</div>':''}`,'ZUM ÖLFELD',()=>{S.tab='field'})}
 }
 const d=new Date(),today=dayStr(d);
 if(S.lastDay!==today){
  const y=new Date(d);y.setDate(y.getDate()-1);
  S.streak=S.lastDay===dayStr(y)?S.streak+1:1;S.lastDay=today;
  const day=((S.streak-1)%7)+1;
  const amt=Math.max(1000,Math.round(Math.max(S.avgRun,1500)*(.6+.25*day)/10)*10),gold=day===7?5:day===3||day===5?2:1;
  let st='<div class="streak7">';for(let i=1;i<=7;i++)st+=`<span class="${i<=day?'on':''}">${i===7?'🌟':'Tag'}<br>${i===7?'5🪙':i}</span>`;st+='</div>';
  info('🎁','Tagesbonus',st+`<div class="hint">${S.streak} ${S.streak===1?'Tag':'Tage'} in Folge</div><div class="total">+${fmt(amt)}</div><div style="font-weight:600;margin-top:4px">+${gold} 🪙 Goldbarren</div><div style="font-size:13px;opacity:.7;margin-top:6px">Komm morgen wieder – der Bonus wächst!</div>`,'EINSAMMELN',()=>{S.money+=amt;S.gold+=gold});
 }
 save();nextInfo();
}

/* ---------- Eingabe ---------- */
cv.addEventListener('pointerdown',e=>{touch.on=true;touch.x=e.clientX;if(e.cancelable)e.preventDefault()},{passive:false});
cv.addEventListener('pointermove',e=>{if(touch.on)touch.x=e.clientX});
const tup=()=>{touch.on=false};
cv.addEventListener('pointerup',tup);cv.addEventListener('pointercancel',tup);cv.addEventListener('pointerleave',tup);
addEventListener('keydown',e=>{if(state!=='play')return;if(e.code==='ArrowLeft'){touch.on=true;touch.x=0}if(e.code==='ArrowRight'){touch.on=true;touch.x=W}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='ArrowRight')touch.on=false});
$('pause').onclick=()=>{if(state==='play'&&G.mode==='run'){paused=true;humStop();show('pauseOv')}};
$('bResume').onclick=()=>{paused=false;show(null);if(G.mode==='run')humStart()};
$('bQuit').onclick=()=>{paused=false;show(null);endRun('Abgebrochen')};
$('bRev').onclick=doRevive;$('bRevNo').onclick=declineRevive;
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(state==='play'&&G.mode==='run'&&!paused){paused=true;humStop();show('pauseOv')}}});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- Schleife ---------- */
let lastT=performance.now(),saveT=0,uiT=0,chartT=0;
function frame(now){
 const dt=Math.min(.033,(now-lastT)/1000);lastT=now;
 if(!SIM){
  idleTick(dt);
  saveT+=dt;if(saveT>5){saveT=0;save()}
  if(state==='hub'){uiT+=dt;chartT+=dt;if(uiT>.25){uiT=0;updTop()}if(chartT>2&&tab==='field'){chartT=0;drawChart()}}
  if(G&&!paused)update(dt);else TT+=dt;
  draw();
 }
 requestAnimationFrame(frame);
}
resize();newWorld();
checkStart();
requestAnimationFrame(frame);

/* ---------- Test-/Balancing-Schnittstelle ---------- */
window.__oel={get G(){return G},get S(){return S},get state(){return state},touch,
 sim:{
  on(){SIM=true},off(){SIM=false},
  reset(){S=JSON.parse(JSON.stringify(DEF));refill()},
  run(bot,maxSec){startRun();let t=0;while(G.mode==='run'&&t<(maxSec||900)){bot(G,touch,W,U);update(1/30);t+=1/30}if(G.mode==='run')finishRun('Zeit');const r=settleRun();r.time=t;r.barrels=G.barrels;r.pockets=G.pockets;r.reg=G.reg;state='hub';return r},
  idle:idleTick,sell:()=>sellLager(null),
  buyUp(id){const u=UPS.find(x=>x.id===id),c=upCost(u,S.up[id]);if(S.up[id]<MAXL&&S.money>=c){S.money-=c;S.up[id]++;return true}return false},
  upCost:id=>upCost(UPS.find(x=>x.id===id),S.up[id]),
  buyPump(){const c=pumpCost(S.pumps);if(S.money>=c){S.money-=c;S.pumps++;return true}return false},pumpCost:()=>pumpCost(S.pumps),
  buyLager(){const c=lagerCost(S.lagerLv);if(S.money>=c){S.money-=c;S.lagerLv++;return true}return false},lagerCost:()=>lagerCost(S.lagerLv),lagerCap:()=>lagerCap(S.lagerLv),pumpRate,
  buyReg(i){const r=REG[i];if(!S.regs.includes(i)&&S.lvl>=r.lv&&S.money>=r.cost){S.money-=r.cost;S.regs.push(i);S.reg=i;return true}return false},
  claimAch(){let g=0;for(const a of ACH)while(achReady(a)){g+=a.g[achTier(a)];S.ach[a.id]=achTier(a)+1}S.gold+=g;return g},
  REG,UPS,refill,xpNeed,
 }};
})();
</script>
