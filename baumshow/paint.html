<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12285c">
<title>Baumshow Battle · Farbschlacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#12285c;font-family:'Fredoka',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:10;background:linear-gradient(180deg,rgba(18,40,92,.9),rgba(10,22,58,.96));overflow-y:auto}
.logo{font-size:44px;font-weight:700;line-height:.95;text-shadow:0 4px 0 #c62839,0 8px 18px rgba(0,0,0,.35)}
.logo span{display:block;color:#ffd54a;text-shadow:0 4px 0 #b9790a;font-size:50px}
.sub{opacity:.9;margin-top:12px;font-size:16px;max-width:330px}
.btn{border:none;border-radius:20px;padding:17px 26px;font:inherit;font-weight:700;font-size:24px;color:#5a3500;background:linear-gradient(#ffe27a,#ffc21a);box-shadow:0 7px 0 #c98a00,0 12px 24px rgba(0,0,0,.3);margin-top:20px;width:100%;max-width:330px}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #c98a00}
a.back{color:#a9cbff;margin-top:16px;font-size:15px}
.big{font-size:72px;font-weight:700;line-height:1;margin-top:6px;text-shadow:0 5px 0 rgba(0,0,0,.25)}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;z-index:5;pointer-events:none;font-weight:700}
#top{display:flex;justify-content:space-between;align-items:center}
#pct{font-size:30px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
#time{font-size:22px;padding:4px 16px;border-radius:999px;background:rgba(10,30,70,.6)}
#time.hot{background:#e5394f;animation:pu .5s infinite alternate}
@keyframes pu{to{transform:scale(1.12)}}
#rank{font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#bars{display:flex;height:16px;border-radius:8px;overflow:hidden;margin-top:8px;border:2px solid #fff;background:rgba(10,30,70,.5)}
#bars i{display:block;height:100%;transition:width .25s}
#toast{position:fixed;left:0;right:0;top:30%;text-align:center;z-index:6;pointer-events:none;font-size:34px;font-weight:700;text-shadow:0 4px 0 rgba(0,0,0,.35);opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.2,1.6,.4,1);transform:scale(.7)}
#toast.on{opacity:1;transform:none}
.row{display:flex;align-items:center;gap:10px;padding:4px 10px;font-size:16px;border-radius:10px;width:100%;max-width:320px}
.row.mine{background:rgba(255,213,74,.18)}
.row i{width:16px;height:16px;border-radius:50%;flex:none}
.row span{flex:1;text-align:left}
#oBest{margin-top:10px;font-size:15px;max-width:330px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden"><div id="top"><div id="pct">0 %</div><div id="time">60</div><div id="rank"></div></div><div id="bars"></div></div>
<div id="toast"></div>
<div id="menu" class="screen">
  <div class="logo">Farb<span>SCHLACHT</span></div>
  <div class="sub">Färbe Delbrück in deiner Farbe. Zieh mit dem Finger, wohin du laufen willst. Die anderen sieben übermalen dich. Nach 60 Sekunden gewinnt die größte Fläche.<br><br>🎨 Farbbombe · ⚡ Tempo · 🖌️ Riesenpinsel</div>
  <button class="btn" id="go">LOS</button>
  <a class="back" href="index.html">← zurück zum Menü</a>
</div>
<div id="over" class="screen hidden">
  <div class="sub" id="oWhy"></div>
  <div class="big" id="oPct"></div>
  <div class="sub" id="oSub"></div>
  <div id="oList" style="margin-top:12px;width:100%;display:flex;flex-direction:column;align-items:center"></div>
  <div id="oBest"></div>
  <button class="btn" id="again">NOCHMAL</button>
  <a class="back" href="index.html">← zurück zum Menü</a>
</div>
<script src="snd/xmas.js"></script>
<script>
const PEOPLE=[{id:'henrik',name:'Henrik',color:'#e5394f'},{id:'alica',name:'Alica',color:'#ff5fa2'},{id:'eric',name:'Eric',color:'#f2851c'},{id:'sophia',name:'Sophia',color:'#f2b705'},{id:'fred',name:'Fred',color:'#2f7ff0'},{id:'selina',name:'Selina',color:'#17b5c9'},{id:'jerome',name:'Jerome',color:'#7a52f0'},{id:'moni',name:'Moni',color:'#c25ef0'}];
const $=id=>document.getElementById(id);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let me=lsGet('bb_me','henrik');if(!PEOPLE.find(p=>p.id===me))me='henrik';
const MUTE=lsGet('bb_mute',false);
const API='https://cfenuthulbpndrqboimq.supabase.co/functions/v1/baumshow';let T0=performance.now();
async function sendScore(game,score){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:me,score,level:1,duration_ms:Math.round(performance.now()-T0),game})});const j=await r.json();let b=j.board;if(!b)b=await (await fetch(API+'?game='+game,{cache:'no-store'})).json();
  const l=b.best||[],top=l[0],mine=l.find(x=>x.player===me);if(!top)return '';const nm=(PEOPLE.find(p=>p.id===top.player)||{}).name||'';
  return top.player===me?'👑 Du führst die Wochen-Rangliste!':'👑 '+nm+' führt mit '+(top.score/10).toLocaleString('de-DE')+' %. Dir fehlen '+((top.score-(mine?mine.score:0)+1)/10).toLocaleString('de-DE')+' Punkte.'}catch(e){return ''}}
// ---------- Audio ----------
let AC=null;const mus={play(){Xmas.rate(1);Xmas.start();return Promise.resolve()},pause(){Xmas.stop()},set currentTime(v){}};
function audioOn(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type,v,slide){if(!AC||MUTE)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.setValueAtTime(v||.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)mus.pause();else if(state==='play'&&!MUTE)mus.play().catch(()=>{})});
// ---------- Welt ----------
const N=64,TOT=N*N,DUR=60,SPEED=9;
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const map=document.createElement('canvas');map.width=map.height=N;const mg=map.getContext('2d');let img=mg.createImageData(N,N);
let own,cnt,E,pl,time,state='menu',items,parts,shake=0,jx=0,jy=0,down=false,ox0=0,oy0=0,cd=0,itemT=0,hudT=0,dirty=true,lastTick=99,tT=0;
const hex=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const HEAD={};PEOPLE.forEach(p=>{const im=new Image();im.src='img/h_'+p.id+'.png';HEAD[p.id]=im});
function toast(t,c){const el=$('toast');el.textContent=t;el.style.color=c||'#fff';el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),900)}
function paint(e,cx,cy,r){const r2=r*r;let ch=0;const y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(N-1,Math.ceil(cy+r)),x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(N-1,Math.ceil(cx+r));
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const dx=x+.5-cx,dy=y+.5-cy;if(dx*dx+dy*dy>r2)continue;const i=y*N+x,o=own[i];if(o===e.i)continue;if(o>=0)cnt[o]--;cnt[e.i]++;own[i]=e.i;const k=i*4;img.data[k]=e.rgb[0];img.data[k+1]=e.rgb[1];img.data[k+2]=e.rgb[2];ch++}
  if(ch)dirty=true;return ch}
function splat(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=2+Math.random()*9;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col,r:.15+Math.random()*.3})}}
function start(){
  own=new Int8Array(TOT).fill(-1);cnt=new Int32Array(8);for(let i=0;i<TOT;i++){const k=i*4,c=((i%N)+Math.floor(i/N))%2?238:246;img.data[k]=c;img.data[k+1]=c+4;img.data[k+2]=255;img.data[k+3]=255}
  const order=[PEOPLE.find(p=>p.id===me),...PEOPLE.filter(p=>p.id!==me)];const sk=[.78,.82,.86,.9,.94,.98,1.02].sort(()=>Math.random()-.5);const off=Math.random()*6.283;
  E=order.map((p,i)=>{const a=off+i/8*6.283;return {i,id:p.id,name:p.name,color:p.color,rgb:hex(p.color),x:N/2+Math.cos(a)*22,y:N/2+Math.sin(a)*22,a:a+Math.PI,boost:0,big:0,stun:0,bot:i>0,tx:N/2,ty:N/2,tt:0,skill:i?sk[i-1]:1,wob:Math.random()*6}});
  pl=E[0];items=[];parts=[];time=DUR;cd=3.2;itemT=1.5;shake=0;jx=jy=0;lastTick=99;dirty=true;state='count';T0=performance.now();
  for(const e of E)paint(e,e.x,e.y,2.5);
  $('bars').innerHTML=E.map(e=>'<i style="background:'+e.color+';width:12.5%"></i>').join('');
  $('menu').classList.add('hidden');$('over').classList.add('hidden');$('hud').classList.remove('hidden');
  if(!MUTE){mus.currentTime=0;mus.play().catch(()=>{})}
}
function retarget(e){let bx=N/2,by=N/2,bs=-1e9;
  for(const it of items){const d=Math.hypot(it.x-e.x,it.y-e.y);if(d<12*e.skill){e.tx=it.x;e.ty=it.y;e.tt=2;return}}
  for(let k=0;k<14;k++){const a=Math.random()*6.283,r=4+Math.random()*16,x=Math.max(2,Math.min(N-2,e.x+Math.cos(a)*r)),y=Math.max(2,Math.min(N-2,e.y+Math.sin(a)*r));let s=-r*.25;
    for(let q=0;q<5;q++){const px=Math.floor(x+(Math.random()-.5)*6),py=Math.floor(y+(Math.random()-.5)*6);if(px<0||py<0||px>=N||py>=N)continue;const o=own[py*N+px];s+=o===e.i?-2:o<0?2:3}
    if(s>bs){bs=s;bx=x;by=y}}
  e.tx=bx;e.ty=by;e.tt=1.2+Math.random()*1.5}
function pick(e,it){
  if(it.t===0){const n=paint(e,it.x,it.y,8);splat(it.x,it.y,e.color,40);for(const o of E)if(o!==e&&Math.hypot(o.x-it.x,o.y-it.y)<8){o.stun=1.2;const d=Math.hypot(o.x-it.x,o.y-it.y)||1;o.x+=(o.x-it.x)/d*3;o.y+=(o.y-it.y)/d*3}
    if(e===pl||Math.hypot(pl.x-it.x,pl.y-it.y)<12){shake=10;tone(90,.5,'sawtooth',.1,35);tone(500,.2,'square',.05,90)}if(e===pl)toast('🎨 FARBBOMBE!','#ffd54a');else if(pl.stun>1.1)toast('💫 Erwischt!','#ff6b7f')}
  else if(it.t===1){e.boost=4;if(e===pl){toast('⚡ TEMPO!','#7dffb0');tone(600,.25,'triangle',.08,1400)}}
  else{e.big=5;if(e===pl){toast('🖌️ RIESENPINSEL!','#9fd0ff');tone(400,.25,'triangle',.08,900)}}}
function end(){
  state='over';mus.pause();const rk=E.slice().sort((a,b)=>cnt[b.i]-cnt[a.i]),r=rk.indexOf(pl)+1,pct=cnt[0]*100/TOT,score=Math.round(pct*10);
  const bk='bb_paint_best_'+me,old=lsGet(bk,0);if(score>old)lsSet(bk,score);
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.08),i*110));
  setTimeout(()=>{$('hud').classList.add('hidden');$('over').classList.remove('hidden');$('oWhy').textContent=r===1?'🏆 Delbrück gehört dir!':'Zeit abgelaufen';$('oPct').textContent=pct.toFixed(1).replace('.',',')+' %';
    $('oSub').textContent='Platz '+r+' von 8'+(score>old?' · neuer Rekord!':' · dein Rekord: '+(old/10).toLocaleString('de-DE')+' %');
    $('oList').innerHTML=rk.map((e,i)=>'<div class="row'+(e===pl?' mine':'')+'"><b>'+(i+1)+'</b><i style="background:'+e.color+'"></i><span>'+e.name+'</span><b>'+(cnt[e.i]*100/TOT).toFixed(1).replace('.',',')+' %</b></div>').join('');$('oBest').textContent=''},700);
  sendScore('paint',score).then(m=>setTimeout(()=>{if(m)$('oBest').innerHTML='<b style="color:#ffd54a">'+m+'</b>'},900));
}
function update(dt){
  if(state==='count'){cd-=dt;const c=Math.ceil(cd-.2);if(c!==lastTick){lastTick=c;if(c>0){toast(String(c));tone(440,.15,'square',.06)}else{toast('LOS!','#ffd54a');tone(880,.3,'square',.08)}}if(cd<=.2){state='play';lastTick=99}return}
  if(state!=='play')return;
  time-=dt;if(time<=10){const c=Math.ceil(time);if(c!==lastTick&&c>0){lastTick=c;tone(900,.08,'square',.05);Xmas.rate(1.22)}}if(time<=0){time=0;end();return}
  itemT-=dt;if(itemT<=0&&items.length<6){itemT=2.2+Math.random()*1.5;const q=Math.random();items.push({x:4+Math.random()*(N-8),y:4+Math.random()*(N-8),t:q<.4?0:q<.7?1:2,b:0})}
  for(const e of E){e.boost-=dt;e.big-=dt;e.wob+=dt*10;
    if(e.stun>0){e.stun-=dt;continue}
    let mx=0,my=0;
    if(e.bot){e.tt-=dt;const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy);if(d<1.2||e.tt<=0){retarget(e)}else{mx=dx/d*e.skill;my=dy/d*e.skill}}
    else{mx=jx;my=jy}
    const m=Math.hypot(mx,my);if(m>.08){const ta=Math.atan2(my,mx);let da=ta-e.a;while(da>Math.PI)da-=6.283;while(da<-Math.PI)da+=6.283;e.a+=da*Math.min(1,dt*10);const sp=SPEED*(e.boost>0?1.55:1)*Math.min(1,m)*dt;e.x=Math.max(1,Math.min(N-1,e.x+Math.cos(e.a)*sp));e.y=Math.max(1,Math.min(N-1,e.y+Math.sin(e.a)*sp))}
    const n=paint(e,e.x,e.y,e.big>0?3:1.6);if(n&&Math.random()<.25)splat(e.x,e.y,e.color,1);
    for(let k=items.length-1;k>=0;k--){const it=items[k];if(Math.hypot(it.x-e.x,it.y-e.y)<2){items.splice(k,1);pick(e,it)}}
  }
  for(let k=parts.length-1;k>=0;k--){const p=parts[k];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.l-=dt*2;if(p.l<=0)parts.splice(k,1)}
  hudT-=dt;if(hudT<=0){hudT=.2;const rk=E.slice().sort((a,b)=>cnt[b.i]-cnt[a.i]);$('pct').textContent=(cnt[0]*100/TOT).toFixed(1).replace('.',',')+' %';$('time').textContent='⏱ '+Math.ceil(time);$('time').classList.toggle('hot',time<=10);$('rank').textContent='Platz '+(rk.indexOf(pl)+1)+'/8';
    let s=0;for(const e of E)s+=cnt[e.i];const b=$('bars').children;rk.forEach((e,i)=>{b[i].style.background=e.color;b[i].style.width=(cnt[e.i]*100/Math.max(1,s))+'%'})}
}
function draw(){
  ctx.fillStyle='#12285c';ctx.fillRect(0,0,W,H);if(!E)return;
  const cs=Math.min(W,H)/19,vw=W/cs,vh=H/cs;let camx=pl.x-vw/2,camy=pl.y-vh/2;
  const sx=(Math.random()-.5)*shake,sy=(Math.random()-.5)*shake;shake*=.88;
  ctx.save();ctx.translate(-camx*cs+sx,-camy*cs+sy);
  if(dirty){mg.putImageData(img,0,0);dirty=false}
  ctx.imageSmoothingEnabled=false;ctx.fillStyle='#0a1638';ctx.fillRect(-cs*.6,-cs*.6,(N+1.2)*cs,(N+1.2)*cs);ctx.drawImage(map,0,0,N*cs,N*cs);ctx.imageSmoothingEnabled=true;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const it of items){it.b+=.08;const y=it.y*cs+Math.sin(it.b)*cs*.15;ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(it.x*cs,it.y*cs+cs*.8,cs*.7,cs*.3,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(it.x*cs,y,cs*1.05,0,7);ctx.fill();ctx.font=(cs*1.3)+'px serif';ctx.fillText(['🎨','⚡','🖌️'][it.t],it.x*cs,y+cs*.08)}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x*cs,p.y*cs,p.r*cs,0,7);ctx.fill()}ctx.globalAlpha=1;
  for(const e of E.slice().sort((a,b)=>a.y-b.y)){const x=e.x*cs,y=e.y*cs,r=cs*1.25,bob=e.stun>0?0:Math.abs(Math.sin(e.wob))*cs*.18;
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(x,y+r*.7,r*.8,r*.3,0,0,7);ctx.fill();
    ctx.save();ctx.translate(x,y-bob);if(e.stun>0)ctx.rotate(Math.sin(e.wob*2)*.4);
    if(e.big>0){ctx.strokeStyle=e.color;ctx.globalAlpha=.5;ctx.lineWidth=cs*.3;ctx.beginPath();ctx.arc(0,0,cs*3,0,7);ctx.stroke();ctx.globalAlpha=1}
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,r+cs*.16,0,7);ctx.fill();ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
    const im=HEAD[e.id];if(im.complete&&im.naturalWidth){ctx.save();ctx.beginPath();ctx.arc(0,0,r*.92,0,7);ctx.clip();ctx.drawImage(im,-r,-r,r*2,r*2);ctx.restore()}
    ctx.restore();
    ctx.font='700 '+(cs*.62)+'px Fredoka,sans-serif';ctx.lineWidth=cs*.16;ctx.strokeStyle='rgba(10,22,58,.8)';const lb=e.stun>0?'💫':e.boost>0?'⚡ '+e.name:e.name;ctx.strokeText(lb,x,y-r-cs*.7-bob);ctx.fillStyle=e===pl?'#ffd54a':'#fff';ctx.fillText(lb,x,y-r-cs*.7-bob)}
  ctx.restore();
  const ms=92,mx=12,my=H-ms-18;ctx.globalAlpha=.9;ctx.fillStyle='#fff';ctx.fillRect(mx-3,my-3,ms+6,ms+6);ctx.imageSmoothingEnabled=false;ctx.drawImage(map,mx,my,ms,ms);ctx.imageSmoothingEnabled=true;ctx.globalAlpha=1;
  ctx.fillStyle='#111';ctx.beginPath();ctx.arc(mx+pl.x/N*ms,my+pl.y/N*ms,4.5,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(mx+pl.x/N*ms,my+pl.y/N*ms,2.5,0,7);ctx.fill();
  if(down&&state==='play'){ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ox0,oy0,46,0,7);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.6)';ctx.beginPath();ctx.arc(ox0+jx*46,oy0+jy*46,18,0,7);ctx.fill()}
}
cv.addEventListener('pointerdown',e=>{audioOn();down=true;ox0=e.clientX;oy0=e.clientY});
cv.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-ox0,dy=e.clientY-oy0,d=Math.hypot(dx,dy);if(d>6){const k=Math.min(1,d/46);jx=dx/d*k;jy=dy/d*k}if(d>64){ox0=e.clientX-dx/d*64;oy0=e.clientY-dy/d*64}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{down=false}));
$('go').onclick=()=>{audioOn();start()};$('again').onclick=()=>{audioOn();start()};
let last=performance.now();
function loop(now){let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;update(dt);draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
window.__paint={get s(){return {state,time,pct:cnt?cnt[0]*100/TOT:0,all:cnt?Array.from(cnt):[]}},joy(x,y){jx=x;jy=y}};
</script>
</body>
</html>
