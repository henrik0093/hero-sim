<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Baumshow Battle · Delbrück erobern</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#dfeaf8;font-family:'Fredoka',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:3;pointer-events:none;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#pct{font-size:34px;color:#1b2a4a;text-shadow:0 2px 0 #fff}#time{font-size:18px;background:rgba(10,30,70,.55);padding:5px 14px;border-radius:999px}
#rank{font-size:13px;text-align:right;line-height:1.5;background:rgba(10,30,70,.45);padding:6px 10px;border-radius:12px;text-shadow:none}
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(180deg,rgba(18,40,92,.9),rgba(10,22,58,.95))}
.hidden{display:none!important}
h1{font-size:40px;line-height:1;text-shadow:0 4px 0 #c62839}h1 span{display:block;color:#ffd54a;text-shadow:0 4px 0 #b9790a}
p{margin-top:12px;font-size:16px;opacity:.9;max-width:330px;font-weight:500}
.big{font-size:72px;font-weight:700;margin-top:8px}
.btn{border:none;border-radius:20px;padding:16px 26px;font:700 22px Fredoka,sans-serif;color:#5a3500;background:linear-gradient(#ffe27a,#ffc21a);box-shadow:0 7px 0 #c98a00;margin-top:18px;width:100%;max-width:320px;text-decoration:none;display:block}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;font-size:16px;padding:12px;margin-top:10px}
#toast{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:30px;font-weight:700;z-index:4;pointer-events:none;opacity:0;transition:opacity .3s;text-shadow:0 3px 0 rgba(0,0,0,.45)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden"><div><div id="pct">0 %</div><div id="time">90</div></div><div id="rank"></div></div>
<div id="toast"></div>
<div id="start" class="screen"><h1>Delbrück<span>erobern</span></h1>
<p>Wisch in eine Richtung, um zu laufen. Verlass dein Gebiet, umrunde ein Stück Karte und kehr zurück: Alles Umrundete gehört dir.</p>
<p>Kreuzt jemand deine offene Spur, bist du raus. Kreuz die Spur der anderen, um sie rauszuwerfen. 90 Sekunden.</p>
<button class="btn" id="go">LOS</button><a class="btn ghost" id="back1">Zurück</a></div>
<div id="over" class="screen hidden"><p id="oWhy"></p><div class="big" id="oPct"></div><p id="oSub"></p><p id="oBest"></p>
<button class="btn" id="again">NOCHMAL</button><a class="btn ghost" id="back2">Zurück zum Menü</a></div>
<script>
(function(){
'use strict';
const PEOPLE=[{id:'henrik',name:'Henrik',color:'#e5394f'},{id:'alica',name:'Alica',color:'#ff5fa2'},{id:'eric',name:'Eric',color:'#f2851c'},{id:'sophia',name:'Sophia',color:'#f2b705'},{id:'fred',name:'Fred',color:'#2f7ff0'},{id:'selina',name:'Selina',color:'#17b5c9'},{id:'jerome',name:'Jerome',color:'#7a52f0'},{id:'moni',name:'Moni',color:'#c25ef0'}];
const $=id=>document.getElementById(id);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let me=lsGet('bb_me','henrik');if(!PEOPLE.find(p=>p.id===me))me='henrik';
$('back1').href=$('back2').href='index.html'+location.search;
const HEAD={};PEOPLE.forEach(p=>{const im=new Image();im.src='img/h_'+p.id+'.png';HEAD[p.id]=im});
const cv=$('c'),ctx=cv.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}
addEventListener('resize',resize);resize();
let AC=null;function audioOn(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type,v,slide){if(!AC)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.setValueAtTime(v||.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}catch(e){}}
function toast(t,c){const e=$('toast');e.textContent=t;e.style.color=c||'#fff';e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,900)}

const N=46,TOT=N*N;let owner,trail,E,pl,time,state='menu',shake=0,parts=[];
const idx=(x,y)=>y*N+x,inb=(x,y)=>x>=0&&y>=0&&x<N&&y<N;
const DIRS=[[1,0],[0,1],[-1,0],[0,-1]];
function claim(e,cx,cy,r){for(let y=cy-r;y<=cy+r;y++)for(let x=cx-r;x<=cx+r;x++)if(inb(x,y))owner[idx(x,y)]=e.i}
function spawn(e){
  let bx=0,by=0,best=-1;
  for(let t=0;t<30;t++){const x=3+Math.floor(Math.random()*(N-6)),y=3+Math.floor(Math.random()*(N-6));let dmin=1e9;for(const o of E){if(o===e||!o.alive)continue;dmin=Math.min(dmin,Math.abs(o.x-x)+Math.abs(o.y-y))}if(dmin>best){best=dmin;bx=x;by=y}}
  e.x=e.px=bx;e.y=e.py=by;e.p=0;e.d=Math.floor(Math.random()*4);e.nd=e.d;e.trail=[];e.alive=true;e.plan=[];e.hx=bx;e.hy=by;claim(e,bx,by,1);
}
function newGame(){
  owner=new Int8Array(TOT).fill(-1);trail=new Int8Array(TOT).fill(-1);E=[];parts=[];
  const order=[me].concat(PEOPLE.filter(p=>p.id!==me).map(p=>p.id));
  order.forEach((id,i)=>{const p=PEOPLE.find(q=>q.id===id);E.push({i,id,name:p.name,color:p.color,bot:i>0,alive:false,kills:0,resp:0,speed:i?6.2:7.2})});
  const ring=[[.5,.82],[.2,.2],[.8,.2],[.15,.55],[.85,.55],[.5,.15],[.25,.85],[.78,.85]];
  E.forEach((e,i)=>{e.x=e.px=Math.round(ring[i][0]*(N-1));e.y=e.py=Math.round(ring[i][1]*(N-1));e.p=0;e.d=3;e.nd=3;e.trail=[];e.alive=true;e.plan=[];e.hx=e.x;e.hy=e.y;claim(e,e.x,e.y,1)});
  pl=E[0];time=90;state='play';
  $('start').classList.add('hidden');$('over').classList.add('hidden');$('hud').classList.remove('hidden');
}
function count(i){let c=0;for(let k=0;k<TOT;k++)if(owner[k]===i)c++;return c}
function kill(v,by){
  if(!v.alive)return;v.alive=false;
  for(const c of v.trail)trail[c]=-1;v.trail=[];
  for(let k=0;k<TOT;k++)if(owner[k]===v.i)owner[k]=-1;
  for(let n=0;n<26;n++)parts.push({x:v.x+.5,y:v.y+.5,vx:(Math.random()-.5)*9,vy:(Math.random()-.5)*9,l:1,c:v.color});
  if(by&&by!==v){by.kills++;if(by===pl){toast(v.name+' rausgeworfen! +50','#ffd54a');tone(300,.3,'square',.08,900)}}
  if(v===pl){shake=14;tone(120,.6,'sawtooth',.1,40);end(by&&by!==v?by.name+' hat deine Spur gekreuzt.':'Du bist in deine eigene Spur gelaufen.')}
  else v.resp=3;
}
function fill(e){
  for(const c of e.trail){owner[c]=e.i;trail[c]=-1}e.trail=[];
  const out=new Uint8Array(TOT),st=[];
  const push=(x,y)=>{if(!inb(x,y))return;const k=idx(x,y);if(out[k]||owner[k]===e.i)return;out[k]=1;st.push(k)};
  for(let i=0;i<N;i++){push(i,0);push(i,N-1);push(0,i);push(N-1,i)}
  while(st.length){const k=st.pop(),x=k%N,y=(k-x)/N;push(x+1,y);push(x-1,y);push(x,y+1);push(x,y-1)}
  let got=0;for(let k=0;k<TOT;k++)if(!out[k]&&owner[k]!==e.i){owner[k]=e.i;got++;if(trail[k]!==-1&&trail[k]!==e.i){/* Spur anderer bleibt */}}
  if(e===pl&&got>0){toast('+'+(got*100/TOT).toFixed(1).replace('.',',')+' %','#7dffb0');tone(500,.2,'triangle',.08,1000)}
}
function arrive(e){
  const c=idx(e.x,e.y);
  if(trail[c]!==-1){const v=E[trail[c]];kill(v,e);if(v===e)return}
  if(owner[c]===e.i){if(e.trail.length)fill(e)}else{trail[c]=e.i;e.trail.push(c)}
}
function botThink(e){
  const free=d=>{const x=e.x+DIRS[d][0],y=e.y+DIRS[d][1];return inb(x,y)&&trail[idx(x,y)]!==e.i};
  // Jagd: fremde Spur direkt nebenan
  for(let d=0;d<4;d++){if((d+2)%4===e.d&&e.trail.length)continue;const x=e.x+DIRS[d][0],y=e.y+DIRS[d][1];if(inb(x,y)){const t=trail[idx(x,y)];if(t!==-1&&t!==e.i){e.nd=d;return}}}
  if(!e.plan.length){
    if(e.trail.length>0){ // heim
      let bd=e.d,bs=1e9;for(let d=0;d<4;d++){if((d+2)%4===e.d||!free(d))continue;const x=e.x+DIRS[d][0],y=e.y+DIRS[d][1];let s=Math.abs(x-e.hx)+Math.abs(y-e.hy);if(owner[idx(x,y)]===e.i)s=-1;if(s<bs){bs=s;bd=d}}
      e.nd=bd;return}
    const a=Math.floor(Math.random()*4),b=(a+(Math.random()<.5?1:3))%4,k=3+Math.floor(Math.random()*5),m=2+Math.floor(Math.random()*5);
    e.plan=[[a,k],[b,m],[(a+2)%4,k]];e.hx=e.x;e.hy=e.y;
  }
  const leg=e.plan[0];let d=leg[0];
  if((d+2)%4===e.d&&e.trail.length)d=(d+1)%4;
  if(!free(d)){e.plan=[];for(let q=0;q<4;q++){const dd=(e.d+q)%4;if((dd+2)%4!==e.d&&free(dd)){d=dd;break}}}
  e.nd=d;if(e.plan.length&&--leg[1]<=0)e.plan.shift();
  if(e.trail.length>16)e.plan=[];
}
function step(e,dt){
  e.p+=e.speed*dt;
  while(e.p>=1&&e.alive){
    e.p-=1;e.px=e.x;e.py=e.y;
    if(e.bot)botThink(e);
    if((e.nd+2)%4!==e.d||!e.trail.length)e.d=e.nd;
    let nx=e.x+DIRS[e.d][0],ny=e.y+DIRS[e.d][1];
    if(!inb(nx,ny)){for(let q=1;q<4;q++){const dd=(e.d+q)%4;const x=e.x+DIRS[dd][0],y=e.y+DIRS[dd][1];if(inb(x,y)&&(dd+2)%4!==e.d){e.d=e.nd=dd;nx=x;ny=y;break}}}
    e.px=e.x;e.py=e.y;e.x=nx;e.y=ny;arrive(e);
  }
}
function end(why){
  if(state!=='play')return;state='over';
  const pct=count(0)*100/TOT,score=Math.round(pct*10+pl.kills*50);
  const bk='bb_arena_best_'+me,old=lsGet(bk,0);if(pct>old)lsSet(bk,Math.round(pct*10)/10);
  setTimeout(()=>{$('hud').classList.add('hidden');$('over').classList.remove('hidden');
    $('oWhy').textContent=why;$('oPct').textContent=pct.toFixed(1).replace('.',',')+' %';
    $('oSub').textContent=pl.kills+' Rauswürfe · '+score+' Punkte';
    $('oBest').textContent=(pct>old?'Neuer Rekord! ':'Dein Rekord: '+String(old).replace('.',',')+' %. ')+(Math.max(pct,old)>=25?'Modus 3 ist freigeschaltet.':'Ab 25 % schaltet sich Modus 3 frei.')},900);
}
// Eingabe: Wischen
let sx=0,sy=0,down=false;
cv.addEventListener('pointerdown',e=>{audioOn();down=true;sx=e.clientX;sy=e.clientY});
cv.addEventListener('pointermove',e=>{if(!down||state!=='play')return;const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.hypot(dx,dy)<14)return;
  const d=Math.abs(dx)>Math.abs(dy)?(dx>0?0:2):(dy>0?1:3);pl.nd=d;sx=e.clientX;sy=e.clientY});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>down=false));
addEventListener('keydown',e=>{const m={ArrowRight:0,ArrowDown:1,ArrowLeft:2,ArrowUp:3}[e.key];if(m!=null&&pl)pl.nd=m});

function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'}
let last=performance.now(),hudT=0;
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'){
    time-=dt;for(const e of E){if(e.alive)step(e,dt);else if(e.bot){e.resp-=dt;if(e.resp<=0)spawn(e)}if(state!=='play')break}
    if(time<=0&&state==='play'){time=0;end('Zeit abgelaufen!')}
    hudT-=dt;if(hudT<=0){hudT=.25;const cs=E.map(e=>({e,c:count(e.i)})).sort((a,b)=>b.c-a.c);
      $('pct').textContent=(count(0)*100/TOT).toFixed(1).replace('.',',')+' %';$('time').textContent='⏱ '+Math.ceil(time);
      $('rank').innerHTML=cs.slice(0,4).map((x,i)=>'<span style="color:'+x.e.color+'">●</span> '+(i+1)+'. '+x.e.name+' '+(x.c*100/TOT).toFixed(0)+' %').join('<br>')}
  }
  // Zeichnen
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#b9cfe8';ctx.fillRect(0,0,W,H);
  if(E){
    const cs=Math.max(20,Math.min(W,H)/15);const fx=pl.px+(pl.x-pl.px)*Math.min(1,pl.p)+.5,fy=pl.py+(pl.y-pl.py)*Math.min(1,pl.p)+.5;
    const ox=W/2-fx*cs+(Math.random()-.5)*shake,oy=H*.55-fy*cs+(Math.random()-.5)*shake;shake*=.88;
    ctx.fillStyle='#f4f8ff';ctx.fillRect(ox,oy,N*cs,N*cs);
    const x0=Math.max(0,Math.floor(-ox/cs)),x1=Math.min(N-1,Math.ceil((W-ox)/cs)),y0=Math.max(0,Math.floor(-oy/cs)),y1=Math.min(N-1,Math.ceil((H-oy)/cs));
    for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const k=idx(x,y),o=owner[k],t=trail[k];
      if(o!==-1){ctx.fillStyle=hexA(E[o].color,.6);ctx.fillRect(ox+x*cs,oy+y*cs,cs+.5,cs+.5)}
      else if((x+y)%2===0){ctx.fillStyle='rgba(150,180,220,.12)';ctx.fillRect(ox+x*cs,oy+y*cs,cs,cs)}
      if(t!==-1){ctx.fillStyle=hexA(E[t].color,.95);ctx.fillRect(ox+x*cs+cs*.18,oy+y*cs+cs*.18,cs*.64,cs*.64)}}
    ctx.strokeStyle='#e5394f';ctx.lineWidth=5;ctx.strokeRect(ox,oy,N*cs,N*cs);
    for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*1.6;ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(ox+p.x*cs-4,oy+p.y*cs-4,8,8)}ctx.globalAlpha=1;parts=parts.filter(p=>p.l>0);
    for(const e of E){if(!e.alive)continue;const t=Math.min(1,e.p),x=ox+(e.px+(e.x-e.px)*t+.5)*cs,y=oy+(e.py+(e.y-e.py)*t+.5)*cs,r=cs*.85;
      ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(x,y+r*.8,r*.8,r*.3,0,0,7);ctx.fill();
      ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      const im=HEAD[e.id];if(im.complete&&im.naturalWidth){ctx.save();ctx.beginPath();ctx.arc(x,y,r*.86,0,7);ctx.clip();ctx.drawImage(im,x-r*.95,y-r*.95,r*1.9,r*1.9);ctx.restore()}
      ctx.lineWidth=3;ctx.strokeStyle=e===pl?'#fff':e.color;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
      ctx.font='700 13px Fredoka,sans-serif';ctx.textAlign='center';ctx.fillStyle='#1b2a4a';ctx.fillText(e.name,x,y-r-6)}
  }
  requestAnimationFrame(frame);
}
$('go').onclick=()=>{audioOn();newGame()};$('again').onclick=()=>{audioOn();newGame()};
requestAnimationFrame(frame);
window.__arena={get s(){return {state,time,pct:E?count(0)*100/TOT:0,alive:pl&&pl.alive}},set nd(v){if(pl)pl.nd=v}};
})();
</script>
</body>
</html>
