<script type="module">

const API='https://cfenuthulbpndrqboimq.supabase.co/functions/v1/baumshow';let T0=performance.now();

let AC=null,lastTone=0;

  for(const [a,b] of PADS){g.fillStyle='rgba(205,225,190,.55)';g.fillRect((a-380)*k,(b-300)*k,760*k,600*k);g.strokeStyle='#9a6b3f';g.lineWidth=4;g.strokeRect((a-380)*k,(b-300)*k,760*k,600*k);g.setLineDash([3,9]);g.lineWidth=8;g.strokeRect((a-380)*k,(b-300)*k,760*k,600*k);g.setLineDash([])}

// ---------- Three ----------
const canvas=$('gl'),renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(2,devicePixelRatio||1));

const TL=new THREE.TextureLoader(),TILT=-.42;

  buildGround();const gt=new THREE.CanvasTexture(ground);gt.colorSpace=THREE.SRGBColorSpace;gt.anisotropy=4;gMat=new THREE.MeshBasicMaterial({map:gt});
  const gm=new THREE.Mesh(new THREE.PlaneGeometry(WS,WS),gMat);gm.rotation.x=-Math.PI/2;gm.position.set(C,0,C);scene.add(gm);
  const out=new THREE.Mesh(new THREE.PlaneGeometry(WS*5,WS*5),new THREE.MeshBasicMaterial({color:'#dfe9f6'}));out.rotation.x=-Math.PI/2;out.position.set(C,-2,C);scene.add(out);

    const im=new THREE.InstancedMesh(pg,m,i<5?420:i===5?130:i===6?300:60);im.count=0;im.frustumCulled=false;im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(im);objMesh.push(im)});
  const cg=new THREE.CircleGeometry(1,18);cg.rotateX(-Math.PI/2);shadowMesh=new THREE.InstancedMesh(cg,new THREE.MeshBasicMaterial({color:'#24385f',transparent:true,opacity:.2,depthWrite:false}),1700);shadowMesh.count=0;shadowMesh.frustumCulled=false;scene.add(shadowMesh);
  const hTex=radial([[0,'#000208'],[.55,'#050a1c'],[.86,'#16224a'],[1,'#2c3d6e']]);
  PEOPLE.forEach(()=>{const g=new THREE.Group();const hg=new THREE.CircleGeometry(1,48);hg.rotateX(-Math.PI/2);const d=new THREE.Mesh(hg,new THREE.MeshBasicMaterial({map:hTex}));d.position.y=1.4;
    const rg=new THREE.RingGeometry(.97,1.1,48);rg.rotateX(-Math.PI/2);const r=new THREE.Mesh(rg,new THREE.MeshBasicMaterial({color:'#fff'}));r.position.y=1.6;
    const ig=new THREE.CircleGeometry(.62,32);ig.rotateX(-Math.PI/2);const inn=new THREE.Mesh(ig,new THREE.MeshBasicMaterial({color:'#000',transparent:true,opacity:.75}));inn.position.set(0,1.5,-.22);

  const gg=new THREE.PlaneGeometry(1,1);glow=new THREE.InstancedMesh(gg,new THREE.MeshBasicMaterial({map:radial([[0,'rgba(255,205,120,1)'],[1,'rgba(255,205,120,0)']]),transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending}),120);glow.count=0;glow.frustumCulled=false;scene.add(glow);

// ---------- Spiel ----------
let O=[],Hs=null,pl,time,state='menu',shake=0,jx=0,jy=0,down=false,ox0=0,oy0=0,tier=0,hudT=0,tT=0,lastTick=99,dusk=0,camD=420;

function add(t,x,y,o){x=Math.max(50,Math.min(WS-50,x));y=Math.max(50,Math.min(WS-50,y));const ob=Object.assign({t,x,y,hx:x,hy:y,r:TY[t].r,s:1,eat:null,et:0,dead:0,ph:Math.random()*6,vx:0,vy:0,wob:0,flip:Math.random()<.5?-1:1},o||{});O.push(ob);return ob}
function stallSet(x,y,n){add(9,x,y);for(let j=0;j<n;j++)add(4,x+rnd(-110,110),y+rnd(50,130));for(let j=0;j<n-1;j++)add(2,x+rnd(-120,120),y+rnd(-130,-60));for(let j=0;j<2;j++)add(3,x+rnd(-100,100),y+rnd(60,130));for(let j=0;j<2;j++)add(1,x+rnd(-90,90),y+rnd(50,110));for(let j=0;j<3;j++)add(0,x+rnd(-130,130),y+rnd(-130,130))}
function buildWorld(){O=[];glowList=[];
  for(let i=0;i<12;i++){const a=i/12*6.283+.26;stallSet(C+Math.cos(a)*410,C+Math.sin(a)*410,4)}

  for(let i=0;i<50;i++){const a=Math.random()*6.283,r=rnd(60,330);add([0,2,3,4,1][Math.floor(Math.random()*5)],C+Math.cos(a)*r,C+Math.sin(a)*r)}

const RAD=m=>22+2.8*Math.sqrt(m);
