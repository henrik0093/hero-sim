<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#12285c">
<title>Baumshow Battle · Schneeloch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#dfe9f6;font-family:'Fredoka',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;z-index:10;background:linear-gradient(180deg,rgba(18,40,92,.9),rgba(10,22,58,.96));overflow-y:auto}
.logo{font-size:44px;font-weight:700;line-height:.95;text-shadow:0 4px 0 #c62839,0 8px 18px rgba(0,0,0,.35)}
.logo span{display:block;color:#ffd54a;text-shadow:0 4px 0 #b9790a;font-size:50px}
.sub{opacity:.92;margin-top:12px;font-size:16px;max-width:330px}
.btn{border:none;border-radius:20px;padding:17px 26px;font:inherit;font-weight:700;font-size:24px;color:#5a3500;background:linear-gradient(#ffe27a,#ffc21a);box-shadow:0 7px 0 #c98a00,0 12px 24px rgba(0,0,0,.3);margin-top:20px;width:100%;max-width:330px}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #c98a00}
a.back{color:#a9cbff;margin-top:16px;font-size:15px}
.big{font-size:72px;font-weight:700;line-height:1;margin-top:6px;text-shadow:0 5px 0 rgba(0,0,0,.25)}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;z-index:5;pointer-events:none;font-weight:700;display:flex;justify-content:space-between;align-items:flex-start}
#pts{font-size:32px;padding:2px 16px;border-radius:999px;background:rgba(10,30,70,.72)}
#time{font-size:20px;padding:5px 14px;border-radius:999px;background:rgba(10,30,70,.72);margin-top:4px}
#time.hot{background:#e5394f;animation:pu .5s infinite alternate}
@keyframes pu{to{transform:scale(1.12)}}
#top3{font-size:14px;padding:6px 10px;border-radius:14px;background:rgba(10,30,70,.6);text-align:right;line-height:1.35;min-width:104px}
#top3 b{color:#ffd54a}
#next{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:5;pointer-events:none;display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:999px;background:rgba(10,30,70,.75);font-weight:700;font-size:15px}
#nIc{width:34px;height:34px;object-fit:contain}
#nW{width:110px;height:10px;border-radius:5px;background:rgba(255,255,255,.2);overflow:hidden}

#toast.on{opacity:1;transform:none}
#oBest{margin-top:10px;font-size:15px;max-width:330px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden"><div><div id="pts">0</div></div><div id="time">90</div><div id="top3"></div></div>
<div id="next" class="hidden"><img id="nIc" alt=""><div id="nW"><div id="nBar"></div></div><span id="nPl"></span></div>

<div id="menu" class="screen">
  <div class="logo">Schnee<span>LOCH</span></div>
  <div class="sub">Du bist ein Loch auf dem Delbrücker Weihnachtsmarkt. Schluck Plätzchen, Bier und Glühwein, dann Wichtel, Tannen und Rentiere, am Ende Buden, Kirche und Riesenrad. Größere Löcher schlucken kleinere. 90 Sekunden.</div>

  <a class="back" href="index.html">← zurück zum Menü</a>
</div>

  <div class="big" id="oPts"></div>
  <div class="sub" id="oSub"></div>
  <div id="oBest"></div>

  <a class="back" href="index.html">← zurück zum Menü</a>
</div>
<script src="snd/xmas.js"></script>
<script>
const PEOPLE=[{id:'henrik',name:'Henrik',color:'#e5394f'},{id:'alica',name:'Alica',color:'#ff5fa2'},{id:'eric',name:'Eric',color:'#f2851c'},{id:'sophia',name:'Sophia',color:'#f2b705'},{id:'fred',name:'Fred',color:'#2f7ff0'},{id:'selina',name:'Selina',color:'#17b5c9'},{id:'jerome',name:'Jerome',color:'#7a52f0'},{id:'moni',name:'Moni',color:'#c25ef0'}];
const $=id=>document.getElementById(id);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let me=lsGet('bb_me','henrik');if(!PEOPLE.find(p=>p.id===me))me='henrik';
const MUTE=lsGet('bb_mute',false);
const API='https://cfenuthulbpndrqboimq.supabase.co/functions/v1/baumshow';let T0=performance.now();
async function sendScore(game,score){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({player:me,score,level:1,duration_ms:Math.round(performance.now()-T0),game})});const j=await r.json();let b=j.board;if(!b)b=await (await fetch(API+'?game='+game,{cache:'no-store'})).json();
  const l=b.best||[],top=l[0],mine=l.find(x=>x.player===me);if(!top)return '';const nm=(PEOPLE.find(p=>p.id===top.player)||{}).name||'';
  return top.player===me?'👑 Du führst die Wochen-Rangliste!':'👑 '+nm+' führt mit '+top.score.toLocaleString('de-DE')+'. Dir fehlen '+(top.score-(mine?mine.score:0)+1).toLocaleString('de-DE')+'.'}catch(e){return ''}}
let AC=null,lastTone=0;
function audioOn(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function tone(f,d,type,v,slide){if(!AC||MUTE)return;try{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,AC.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.setValueAtTime(v||.08,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}catch(e){}}
// ---------- Welt ----------
const WS=2600,C=WS/2,DUR=90;
const TY=[{k:'cookie',r:9,v:1,n:'Plätzchen'},{k:'wurst',r:11,v:2,n:'Bratwurst'},{k:'beer',r:12,v:2,n:'Bier'},{k:'martini',r:13,v:3,n:'Espresso Martini'},{k:'mug',r:14,v:3,n:'Glühwein'},{k:'gnome',r:17,v:5,n:'Wichtel'},
  {k:'tree',r:26,v:8,n:'Tannenbäume'},{k:'sled',r:32,v:12,n:'Schlitten'},{k:'deer',r:40,v:18,n:'Rentiere'},{k:'stall',r:58,v:36,n:'Glühweinbuden'},{k:'church',r:85,v:70,n:'die Kirche'},{k:'wheel',r:105,v:120,n:'das Riesenrad'}];
const IM=TY.map(t=>{const im=new Image();im.src='img/w_'+t.k+'.png';return im});
const HEAD={};PEOPLE.forEach(p=>{const im=new Image();im.src='img/h_'+p.id+'.png';HEAD[p.id]=im});
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random()*(b-a);
const ground=document.createElement('canvas');
function buildGround(){const S=1300,k=S/WS;ground.width=ground.height=S;const g=ground.getContext('2d');
  g.fillStyle='#eaf2fb';g.fillRect(0,0,S,S);
  for(let i=0;i<900;i++){g.fillStyle=Math.random()<.5?'rgba(255,255,255,.9)':'rgba(190,210,235,.35)';g.beginPath();g.ellipse(Math.random()*S,Math.random()*S,rnd(6,26),rnd(3,10),0,0,7);g.fill()}
  g.fillStyle='#cfc3aa';g.fillRect(0,(C-80)*k,S,160*k);g.fillRect((C-80)*k,0,160*k,S);g.beginPath();g.arc(C*k,C*k,430*k,0,7);g.fill();
  g.fillStyle='rgba(120,105,85,.28)';for(let i=0;i<2600;i++){const x=Math.random()*S,y=Math.random()*S,dx=x/k-C,dy=y/k-C;if(Math.abs(dx)<78||Math.abs(dy)<78||dx*dx+dy*dy<425*425){g.beginPath();g.ellipse(x,y,rnd(3,6),rnd(2,4),0,0,7);g.fill()}}
  g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=5;g.beginPath();g.arc(C*k,C*k,432*k,0,7);g.stroke();
  g.fillStyle='#bfe3f7';g.beginPath();g.ellipse(2050*k,2050*k,300*k,210*k,0,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=6;g.stroke();
  g.strokeStyle='rgba(255,255,255,.75)';g.lineWidth=2;for(let i=0;i<26;i++){g.beginPath();const x=rnd(1820,2280)*k,y=rnd(1900,2200)*k;g.moveTo(x,y);g.quadraticCurveTo(x+rnd(-30,30),y+rnd(-20,20),x+rnd(-60,60),y+rnd(-30,30));g.stroke()}
  g.strokeStyle='#9a6b3f';g.lineWidth=5;g.strokeRect(330*k,1720*k,640*k,520*k);g.setLineDash([3,10]);g.lineWidth=9;g.strokeRect(330*k,1720*k,640*k,520*k);g.setLineDash([]);
  g.fillStyle='rgba(160,185,215,.5)';for(let i=0;i<160;i++){const x=rnd(0,S),y=rnd(0,S);g.beginPath();g.ellipse(x,y,2.4,3.6,rnd(0,3),0,7);g.fill()}
}
let O,Hs,pl,time,state='menu',zoom=1,shake=0,jx=0,jy=0,down=false,ox0=0,oy0=0,tier=0,pops,snow,hudT=0,tT=0,lastTick=99,dusk=0;
function toast(t,c){const el=$('toast');el.textContent=t;el.style.color=c||'#fff';el.classList.add('on');clearTimeout(tT);tT=setTimeout(()=>el.classList.remove('on'),1100)}
function add(t,x,y,o){x=Math.max(40,Math.min(WS-40,x));y=Math.max(40,Math.min(WS-40,y));O.push(Object.assign({t,x,y,hx:x,hy:y,r:TY[t].r,s:1,eat:null,dead:0,ph:Math.random()*6,vx:0,vy:0,wob:0,flip:Math.random()<.5?-1:1},o||{}))}
function buildWorld(){O=[];
  for(let i=0;i<10;i++){const a=i/10*6.283+.3,x=C+Math.cos(a)*330,y=C+Math.sin(a)*330;add(9,x,y);
    for(let j=0;j<4;j++)add(4,x+rnd(-110,110),y+rnd(40,120));for(let j=0;j<3;j++)add(2,x+rnd(-120,120),y+rnd(-120,-50));for(let j=0;j<2;j++)add(3,x+rnd(-100,100),y+rnd(60,130));for(let j=0;j<2;j++)add(1,x+rnd(-90,90),y+rnd(50,110));for(let j=0;j<3;j++)add(0,x+rnd(-130,130),y+rnd(-130,130))}
  for(const [x,y] of [[C-700,C-150],[C+700,C+150],[C-150,C+720],[C+150,C-720]]){add(9,x,y);for(let j=0;j<5;j++)add(4,x+rnd(-110,110),y+rnd(40,120));for(let j=0;j<3;j++)add(2,x+rnd(-110,110),y+rnd(-110,110))}
  add(10,C,330);add(11,2150,C-40);
  for(let i=0;i<14;i++)add(0,C+rnd(-170,170),330+rnd(110,230));
  for(let i=0;i<76;i++){let x,y;do{x=rnd(60,WS-60);y=rnd(60,WS-60)}while(Math.abs(x-C)<620||Math.abs(y-C)<620||(x<1000&&y>1680)||(x>1700&&y>1800));add(6,x,y)}
  for(let i=0;i<16;i++)add(8,rnd(380,920),rnd(1770,2190),{mv:'deer',ax:330,ay:1720,bx:970,by:2240,tt:0});
  for(let i=0;i<14;i++)add(7,rnd(1800,2300),rnd(1900,2200),{mv:'sled',vx:rnd(60,120)*(Math.random()<.5?-1:1),ax:1780,bx:2320});
  for(let i=0;i<44;i++){const hz=Math.random()<.5,p=rnd(120,WS-120),q=C+rnd(-60,60);add(5,hz?p:q,hz?q:p,{mv:'gnome',hz,dir:Math.random()<.5?-1:1,sp:rnd(34,62)})}
  for(let i=0;i<60;i++){const hz=Math.random()<.5,p=rnd(100,WS-100),q=C+rnd(-70,70);add([0,0,1,2,3,4][Math.floor(Math.random()*6)],hz?p:q,hz?q:p)}
  for(let i=0;i<36;i++){const a=Math.random()*6.283,r=rnd(60,300);add([0,2,3,4,1][Math.floor(Math.random()*5)],C+Math.cos(a)*r,C+Math.sin(a)*r)}
}
const RAD=m=>22+2.8*Math.sqrt(m);
function grow(h,v){h.m+=v;h.R=RAD(h.m)}
function start(){
  buildWorld();const order=[PEOPLE.find(p=>p.id===me),...PEOPLE.filter(p=>p.id!==me)],sk=[.74,.78,.82,.86,.9,.95,1].sort(()=>Math.random()-.5),off=Math.random()*6.283;
  Hs=order.map((p,i)=>{const a=off+i/7*6.283;return {i,id:p.id,name:p.name,color:p.color,x:i?C+Math.cos(a)*900:C,y:i?C+Math.sin(a)*900:C+40,m:0,R:RAD(0),Rs:RAD(0),bot:i>0,skill:i?sk[i-1]:1,tx:C,ty:C,tt:0,dead:0,eaten:0,a:0}});
  pl=Hs[0];pops=[];snow=[];for(let i=0;i<70;i++)snow.push({x:Math.random(),y:Math.random(),s:rnd(.5,1.4),v:rnd(.03,.09)});
  time=DUR;tier=0;shake=0;jx=jy=0;dusk=0;lastTick=99;zoom=Math.min(W,H)/380;state='play';T0=performance.now();
  $('menu').classList.add('hidden');$('over').classList.add('hidden');$('hud').classList.remove('hidden');$('next').classList.remove('hidden');
  if(!MUTE){Xmas.rate(1);Xmas.start()}toast('Schluck alles, was reinpasst!','#ffd54a');
}
function retarget(h){let bs=-1e9,bx=C,by=C;
  for(const o of Hs){if(o===h||o.dead>0)continue;const d=Math.hypot(o.x-h.x,o.y-h.y);
    if(o.R>h.R*1.12&&d<o.R+260){h.tx=h.x-(o.x-h.x)/d*400;h.ty=h.y-(o.y-h.y)/d*400;h.tt=.5;return}
    if(h.R>o.R*1.12&&d<380&&h.skill>.8&&(o!==pl||time<DUR-10)){const s=o.m*4+120-d;if(s>bs){bs=s;bx=o.x;by=o.y}}}
  for(let k=0;k<70;k++){const o=O[Math.floor(Math.random()*O.length)];if(o.eat||o.dead>0||o.r>=h.R*.8)continue;const d=Math.hypot(o.x-h.x,o.y-h.y),s=TY[o.t].v*16-d*(1.3-h.skill*.5);if(s>bs){bs=s;bx=o.x;by=o.y}}
  h.tx=bx;h.ty=by;h.tt=.35+Math.random()*.4}
function end(){
  state='over';Xmas.stop();const pts=Math.round(pl.m),rk=Hs.slice().sort((a,b)=>b.m-a.m).indexOf(pl)+1;
  const bk='bb_loch_best_'+me,old=lsGet(bk,0);if(pts>old)lsSet(bk,pts);[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.25,'triangle',.08),i*110));
  setTimeout(()=>{$('hud').classList.add('hidden');$('next').classList.add('hidden');$('over').classList.remove('hidden');$('oWhy').textContent=rk===1?'🏆 Größtes Loch von Delbrück!':'Zeit abgelaufen';$('oPts').textContent=pts.toLocaleString('de-DE');
    $('oSub').textContent='Platz '+rk+' von 8 · '+pl.eaten+' Löcher geschluckt'+(pts>old?' · neuer Rekord!':' · dein Rekord: '+old.toLocaleString('de-DE'));$('oBest').textContent=''},800);
  sendScore('loch',pts).then(m=>setTimeout(()=>{if(m)$('oBest').innerHTML='<b style="color:#ffd54a">'+m+'</b>'},1000));
}
function update(dt){
  if(state!=='play')return;
  time-=dt;dusk=Math.max(0,Math.min(1,(DUR-30-time)/-1>0?0:(DUR-time-45)/35));
  if(time<=10){const c=Math.ceil(time);if(c!==lastTick&&c>0){lastTick=c;tone(900,.08,'square',.05);Xmas.rate(1.22)}}
  if(time<=0){time=0;end();return}
  for(const h of Hs){
    if(h.dead>0){h.dead-=dt;if(h.dead<=0){const a=Math.random()*6.283;h.x=C+Math.cos(a)*rnd(500,1100);h.y=C+Math.sin(a)*rnd(500,1100);h.Rs=6}continue}
    let mx=0,my=0;
    if(h.bot){h.tt-=dt;if(h.tt<=0)retarget(h);const dx=h.tx-h.x,dy=h.ty-h.y,d=Math.hypot(dx,dy)||1;mx=dx/d*h.skill;my=dy/d*h.skill}else{mx=jx;my=jy}
    const sp=(215+h.R*.45)*dt;h.x=Math.max(h.R*.5,Math.min(WS-h.R*.5,h.x+mx*sp));h.y=Math.max(h.R*.5,Math.min(WS-h.R*.5,h.y+my*sp));h.Rs+=(h.R-h.Rs)*Math.min(1,dt*6);h.a+=dt;
  }
  for(const a of Hs){if(a.dead>0)continue;for(const b of Hs){if(a===b||b.dead>0||a.R<b.R*1.12)continue;if(Math.hypot(a.x-b.x,a.y-b.y)<a.R-b.R*.3){const g=Math.round(b.m*.35)+5;grow(a,g);a.eaten++;b.m=Math.floor(b.m*.5);b.R=RAD(b.m);b.dead=2.2;
    if(a===pl){toast('😈 '+b.name+' geschluckt! +'+g,'#ffd54a');shake=14;tone(200,.4,'sawtooth',.09,60)}else if(b===pl){toast('😵 '+a.name+' hat dich geschluckt!','#ff8a9a');shake=18;tone(300,.5,'sawtooth',.09,50);jx=jy=0}}}}
  for(const o of O){
    if(o.dead>0){o.dead-=dt;if(o.dead<=0){o.x=o.hx;o.y=o.hy;o.s=0;o.eat=null}continue}
    if(o.eat){const h=o.eat;o.et+=dt;o.x+=(h.x-o.x)*Math.min(1,dt*12);o.y+=(h.y-o.y)*Math.min(1,dt*12);o.s=Math.max(0,1-o.et/.32);if(o.s<=0){o.dead=o.t>=9?1e9:o.t>=6?rnd(22,34):rnd(9,16);o.eat=null}continue}
    if(o.s<1)o.s=Math.min(1,o.s+dt*3);o.wob=Math.max(0,o.wob-dt*3);
    if(o.mv==='gnome'){let fx=0,fy=0;for(const h of Hs){if(h.dead>0)continue;const dx=o.x-h.x,dy=o.y-h.y,d=Math.hypot(dx,dy);if(d<h.R+130){fx+=dx/d;fy+=dy/d}}
      if(fx||fy){const d=Math.hypot(fx,fy);o.x+=fx/d*95*dt;o.y+=fy/d*95*dt;o.flip=fx<0?-1:1;o.run=1}else{o.run=0;const v=o.sp*o.dir*dt;if(o.hz){o.x+=v;o.y+=(C+Math.sin(o.ph+o.x*.01)*50-o.y)*dt}else{o.y+=v;o.x+=(C+Math.sin(o.ph+o.y*.01)*50-o.x)*dt}o.flip=o.hz?o.dir:o.flip;const p=o.hz?o.x:o.y;if(p<90||p>WS-90)o.dir*=-1}
      o.x=Math.max(40,Math.min(WS-40,o.x));o.y=Math.max(40,Math.min(WS-40,o.y));o.hx=o.hz?o.x:C;o.hy=o.hz?C:o.y}
    else if(o.mv==='deer'){o.tt-=dt;if(o.tt<=0){o.tt=rnd(1,3.5);const a=Math.random()*6.283,s=Math.random()<.35?0:rnd(20,48);o.vx=Math.cos(a)*s;o.vy=Math.sin(a)*s}o.x+=o.vx*dt;o.y+=o.vy*dt;if(o.x<o.ax+40||o.x>o.bx-40)o.vx*=-1;if(o.y<o.ay+40||o.y>o.by-40)o.vy*=-1;o.x=Math.max(o.ax+36,Math.min(o.bx-36,o.x));o.y=Math.max(o.ay+36,Math.min(o.by-36,o.y));if(o.vx)o.flip=o.vx<0?-1:1}
    else if(o.mv==='sled'){o.x+=o.vx*dt;if(o.x<o.ax||o.x>o.bx)o.vx*=-1;o.flip=o.vx<0?-1:1}
    for(const h of Hs){if(h.dead>0)continue;const dx=o.x-h.x,dy=o.y-h.y,d2=dx*dx+dy*dy;
      if(o.r>=h.R*.8){if(d2<(h.R+o.r*.5)**2&&o.wob<.2){o.wob=1;if(h===pl&&performance.now()-lastTone>220){lastTone=performance.now();tone(120,.08,'square',.03)}}continue}

        if(h===pl){pops.push({x:o.x,y:o.y,t:'+'+v,l:1,big:o.t>=6});const n=performance.now();if(n-lastTone>45){lastTone=n;tone(320+Math.min(900,v*16)+Math.random()*40,.08,'sine',.06,200)}if(o.t>=8){shake=5+o.t*1.4;toast('+'+v+' '+TY[o.t].n.replace(/^(die|das) /,''),'#ffd54a');tone(110,.35,'sawtooth',.08,50)}}break}}
  }
  for(let k=pops.length-1;k>=0;k--){const p=pops[k];p.y-=40*dt;p.l-=dt*1.5;if(p.l<=0)pops.splice(k,1)}
  const lim=pl.R*.8;let ni=TY.findIndex(t=>t.r>=lim);if(ni<0)ni=TY.length;if(ni>tier){if(tier>0&&ni<=TY.length){const t=TY[ni-1];toast('Jetzt passen '+t.n+' rein!','#7dffb0');tone(600,.25,'triangle',.08,1300)}tier=ni}
  hudT-=dt;if(hudT<=0){hudT=.2;const rk=Hs.slice().sort((a,b)=>b.m-a.m);$('pts').textContent=Math.round(pl.m).toLocaleString('de-DE');$('time').textContent='⏱ '+Math.ceil(time);$('time').classList.toggle('hot',time<=10);
    $('top3').innerHTML=rk.slice(0,3).map((h,i)=>(h===pl?'<b>':'')+(i+1)+'. '+h.name+' '+Math.round(h.m)+(h===pl?'</b>':'')).join('<br>')+(rk.indexOf(pl)>2?'<br><b>'+(rk.indexOf(pl)+1)+'. '+pl.name+' '+Math.round(pl.m)+'</b>':'');
    if(ni>=TY.length){$('nIc').src='img/w_wheel.png';$('nBar').style.width='100%';$('nPl').textContent='alles passt!'}else{const pr=ni?TY[ni-1].r:6;$('nIc').src='img/w_'+TY[ni].k+'.png';$('nBar').style.width=Math.max(0,Math.min(100,(lim-pr)/(TY[ni].r-pr)*100))+'%';$('nPl').textContent='als Nächstes'}}
}
function draw(){
  ctx.fillStyle='#dfe9f6';ctx.fillRect(0,0,W,H);if(!Hs){return}

  for(const h of Hs){if(h.dead>0)continue;const x=cx+h.x*zoom,y=cy+h.y*zoom,r=h.Rs*zoom;
    const gr=ctx.createRadialGradient(x,y+r*.15,r*.2,x,y,r);gr.addColorStop(0,'#02040c');gr.addColorStop(.8,'#0b1430');gr.addColorStop(1,'#26365f');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    ctx.lineWidth=Math.max(2.5,r*.09);ctx.strokeStyle=h.color;ctx.stroke();ctx.lineWidth=Math.max(1,r*.03);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.beginPath();ctx.arc(x,y,r*1.06,h.a,h.a+1.6);ctx.stroke();ctx.beginPath();ctx.arc(x,y,r*1.06,h.a+3.14,h.a+4.7);ctx.stroke()}
  const vis=[];for(const o of O){if(o.dead>0)continue;const x=cx+o.x*zoom,y=cy+o.y*zoom,r=o.r*zoom;if(x<-r*3||y<-r*3||x>W+r*3||y>H+r*4)continue;vis.push(o)}

    if(!o.eat){ctx.fillStyle='rgba(40,60,100,.2)';ctx.beginPath();ctx.ellipse(x,y+r*.25,r*.95,r*.42,0,0,7);ctx.fill()}

    const sz=r*(o.t>=9?3.1:2.7);if(im.complete&&im.naturalWidth)ctx.drawImage(im,-sz/2,-sz*.78,sz,sz);else{ctx.fillStyle='#c9d6ea';ctx.beginPath();ctx.arc(0,-r*.4,r,0,7);ctx.fill()}
    ctx.restore()}
  if(dusk>0){ctx.fillStyle='rgba(18,26,84,'+(dusk*.42)+')';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='lighter';
    for(const o of vis){if(o.t<9&&o.t!==6)continue;const x=cx+o.x*zoom,y=cy+(o.y-o.r)*zoom,r=o.r*zoom*(o.t===6?1.6:2.6);const gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,200,110,'+(dusk*.5)+')');gr.addColorStop(1,'rgba(255,200,110,0)');ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,r*2,r*2)}
    ctx.globalCompositeOperation='source-over'}
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(const h of Hs){if(h.dead>0)continue;const x=cx+h.x*zoom,y=cy+h.y*zoom,r=h.Rs*zoom,hr=Math.max(13,Math.min(26,r*.42)),hy=y-r-hr-4;
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,hy,hr+2.5,0,7);ctx.fill();ctx.fillStyle=h.color;ctx.beginPath();ctx.arc(x,hy,hr,0,7);ctx.fill();const im=HEAD[h.id];if(im.complete&&im.naturalWidth){ctx.save();ctx.beginPath();ctx.arc(x,hy,hr*.93,0,7);ctx.clip();ctx.drawImage(im,x-hr,hy-hr,hr*2,hr*2);ctx.restore()}
    ctx.font='700 13px Fredoka,sans-serif';ctx.lineWidth=4;ctx.strokeStyle='rgba(10,22,58,.85)';const lb=h.name+' · '+Math.round(h.m);ctx.strokeText(lb,x,hy-hr-11);ctx.fillStyle=h===pl?'#ffd54a':'#fff';ctx.fillText(lb,x,hy-hr-11)}

  ctx.fillStyle='rgba(255,255,255,.9)';for(const s of snow){s.y+=s.v*.016*60/60;s.x+=Math.sin(s.y*20+s.s*9)*.0006;if(s.y>1){s.y=0;s.x=Math.random()}ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.s*2,0,7);ctx.fill()}
  for(const h of Hs){if(h===pl||h.dead>0||h.R<pl.R*1.12)continue;const dx=h.x-pl.x,dy=h.y-pl.y,d=Math.hypot(dx,dy);if(d>700||(Math.abs(dx*zoom)<W/2-20&&Math.abs(dy*zoom)<H/2-20))continue;const a=Math.atan2(dy,dx),ex=W/2+Math.cos(a)*(W/2-30),ey=H/2+Math.sin(a)*(H/2-90);ctx.save();ctx.translate(ex,ey);ctx.rotate(a);ctx.fillStyle='#e5394f';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(-10,-11);ctx.lineTo(-10,11);ctx.closePath();ctx.fill();ctx.restore()}

  if(down&&state==='play'){ctx.strokeStyle='rgba(10,30,70,.45)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(ox0,oy0,46,0,7);ctx.stroke();ctx.fillStyle='rgba(10,30,70,.5)';ctx.beginPath();ctx.arc(ox0+jx*46,oy0+jy*46,18,0,7);ctx.fill()}
}
cv.addEventListener('pointerdown',e=>{audioOn();down=true;ox0=e.clientX;oy0=e.clientY});
cv.addEventListener('pointermove',e=>{if(!down)return;const dx=e.clientX-ox0,dy=e.clientY-oy0,d=Math.hypot(dx,dy);if(d>6){const k=Math.min(1,d/46);jx=dx/d*k;jy=dy/d*k}if(d>64){ox0=e.clientX-dx/d*64;oy0=e.clientY-dy/d*64}});
['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>{down=false;jx=jy=0}));

function loop(now){let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;update(dt);draw();requestAnimationFrame(loop)}
