<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#7fb6ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Baumshow Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#7fb6ef;font-family:'Fredoka',system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 22px);text-align:center;z-index:10;overflow-y:auto;touch-action:pan-y}
.dim{background:linear-gradient(180deg,rgba(18,40,92,.86),rgba(10,22,58,.94))}
.hidden{display:none!important}
.logo{font-size:46px;font-weight:700;line-height:.92;margin-top:6px;letter-spacing:.5px;color:#fff;text-shadow:0 4px 0 #c62839,0 8px 18px rgba(0,0,0,.35)}
.logo span{display:block;color:#ffd54a;text-shadow:0 4px 0 #b9790a,0 8px 18px rgba(0,0,0,.35);font-size:56px}
.sub{opacity:.9;margin-top:8px;font-size:15px;font-weight:500}
.pill{display:inline-block;margin:12px 0 2px;padding:7px 14px;border-radius:999px;background:rgba(255,213,74,.16);color:#ffd54a;font-weight:600;font-size:14px}
.btn{border:none;border-radius:20px;padding:17px 26px;font:inherit;font-weight:700;font-size:24px;cursor:pointer;color:#5a3500;background:linear-gradient(#ffe27a,#ffc21a);box-shadow:0 7px 0 #c98a00,0 12px 24px rgba(0,0,0,.3);margin-top:16px;width:100%;max-width:340px;letter-spacing:.5px}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 #c98a00}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none;font-size:16px;padding:12px;margin-top:10px}
.me{display:flex;align-items:center;gap:10px;margin-top:14px;padding:7px 14px 7px 7px;border-radius:999px;background:rgba(255,255,255,.12);font-size:17px;font-weight:600}
.me button{border:none;background:none;color:#a9cbff;font:inherit;font-size:14px;margin-left:4px;text-decoration:underline}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;color:#fff;background-size:cover;background-position:center;flex:none;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:380px;margin-top:18px}
.pick{border:none;background:rgba(255,255,255,.1);border-radius:18px;padding:12px 4px;color:#fff;font:inherit;font-weight:600;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:7px}
.pick .av{width:56px;height:56px;font-size:25px}
.pick:active{transform:scale(.94)}
.board{width:100%;max-width:380px;margin-top:18px;background:rgba(255,255,255,.09);border-radius:18px;padding:10px 12px;text-align:left}
.board h3{font-size:12px;opacity:.75;font-weight:600;margin:2px 0 6px;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;padding:5px 3px;font-size:16px;border-radius:10px}
.row.mine{background:rgba(255,213,74,.16)}
.row .rk{width:24px;text-align:center;font-weight:700;opacity:.85}
.row .n{flex:1}
.row .s{font-weight:700}
.row .av{width:30px;height:30px;font-size:14px}
.big{font-size:80px;font-weight:700;line-height:1;margin-top:4px;text-shadow:0 5px 0 rgba(0,0,0,.25)}
.rec{display:inline-block;margin-top:8px;padding:5px 14px;border-radius:999px;background:#e5394f;font-weight:700;animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.taunt{margin-top:10px;font-size:17px;color:#ffd54a;min-height:22px;font-weight:600}
.note{font-size:13px;opacity:.7;margin-top:10px}
/* HUD */
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none;font-weight:700}
#hScore{font-size:30px;text-shadow:0 3px 0 rgba(0,0,0,.3);min-width:90px}
#hLevel{font-size:16px;padding:5px 14px;border-radius:999px;background:rgba(10,30,70,.45)}
#hHearts{font-size:20px;letter-spacing:1px;min-width:90px;text-align:right}
#champ{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);width:min(64vw,260px);height:18px;border-radius:999px;background:rgba(10,30,70,.45);z-index:5;pointer-events:none;overflow:hidden;border:2px solid rgba(255,255,255,.7)}
#champFill{height:100%;width:0;background:linear-gradient(90deg,#ffd54a,#ff9f1c);border-radius:999px;transition:width .1s}
#champLbl{position:absolute;inset:0;font-size:11px;line-height:14px;font-weight:700;text-align:center;color:#3a2400;letter-spacing:1px}
#hpLbl{position:fixed;z-index:4;pointer-events:none;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px}
#hpName{font-size:13px;font-weight:700;background:rgba(10,30,70,.6);padding:2px 10px;border-radius:999px;white-space:nowrap}
#hpBar{width:120px;height:16px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid #fff;overflow:hidden;position:relative}
#hpFill{height:100%;background:linear-gradient(90deg,#ff4d6a,#ff7a59);width:100%}
#hpTxt{position:absolute;inset:0;font-size:11px;line-height:12px;text-align:center;font-weight:700}
.ft{position:fixed;z-index:6;pointer-events:none;font-weight:700;transform:translate(-50%,-50%);text-shadow:0 2px 0 rgba(0,0,0,.45);white-space:nowrap}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;z-index:7;pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1)}
#banner.on{opacity:1;transform:none}
#banner b{display:block;font-size:44px;color:#fff;text-shadow:0 4px 0 #c62839,0 8px 20px rgba(0,0,0,.35)}
#banner span{display:inline-block;margin-top:6px;font-size:18px;font-weight:600;background:rgba(10,30,70,.55);padding:5px 14px;border-radius:999px}
#hint{position:fixed;left:0;right:0;bottom:22%;text-align:center;z-index:6;pointer-events:none;font-size:20px;font-weight:700;text-shadow:0 2px 0 rgba(0,0,0,.35);animation:sway 1.2s ease-in-out infinite alternate}
@keyframes sway{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
/* Upgrades */
.cards{display:flex;flex-direction:column;gap:12px;width:100%;max-width:360px;margin-top:18px}
.card{border:none;border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;text-align:left;font:inherit;color:#1b2a4a;background:linear-gradient(#fff,#e8f1ff);box-shadow:0 6px 0 #9db7e0,0 10px 20px rgba(0,0,0,.25);animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card:active{transform:translateY(4px);box-shadow:0 2px 0 #9db7e0}
.card .ic{font-size:36px;width:52px;height:52px;border-radius:14px;background:#ffefc2;display:flex;align-items:center;justify-content:center;flex:none}
.card b{display:block;font-size:19px}
.card small{font-size:14px;opacity:.75;font-weight:500}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud" class="hidden"><div id="hScore">0</div><div id="hLevel">Level 1</div><div id="hHearts"></div></div>
<div id="champ" class="hidden"><div id="champFill"></div><div id="champLbl">CHAMPION</div></div>
<div id="hpLbl" class="hidden"><div id="hpName"></div><div id="hpBar"><div id="hpFill"></div><div id="hpTxt"></div></div></div>
<div id="banner"><b id="bTitle"></b><span id="bSub"></span></div>
<div id="hint" class="hidden">👆 Halten &amp; ziehen</div>
<div id="fts"></div>

<div id="who" class="screen dim hidden">
  <div class="logo">Baumshow<span>BATTLE</span></div>
  <div class="sub">Wer bist du?</div>
  <div class="grid" id="pickGrid"></div>
  <div class="note">Wird auf diesem Handy gemerkt.</div>
</div>

<div id="start" class="screen dim hidden">
  <div class="logo">Baumshow<span>BATTLE</span></div>
  <div class="pill" id="countdown"></div>
  <div class="me" id="meBox"></div>
  <button class="btn" id="play">SPIELEN</button>
  <div class="board" id="board1"></div>
  <div class="note" style="max-width:340px">Halten und ziehen. Schieß deine Wichtel durch die Tore, damit sie sich vervielfachen. Erobere die Burg, bevor die Krampusse unten ankommen.</div>
</div>

<div id="upg" class="screen dim hidden">
  <div class="logo" style="font-size:34px">Burg erobert!</div>
  <div class="sub" id="upgSub">Wähle einen Bonus</div>
  <div class="cards" id="cards"></div>
</div>

<div id="over" class="screen dim hidden">
  <div class="sub" id="oWho"></div>
  <div class="big" id="oScore">0</div>
  <div class="sub" id="oLevel"></div>
  <div id="oRec"></div>
  <div class="taunt" id="oTaunt"></div>
  <button class="btn" id="again">NOCHMAL</button>
  <button class="btn ghost" id="toMenu">Menü</button>
  <div class="board" id="board2"></div>
  <div class="note" id="oNet"></div>
</div>

<script type="module">
import * as THREE from 'three';

const API='https://cfenuthulbpndrqboimq.supabase.co/functions/v1/baumshow';
const PEOPLE=[
 {id:'henrik',name:'Henrik',color:'#e5394f'},{id:'alica',name:'Alica',color:'#ff5fa2'},
 {id:'eric',name:'Eric',color:'#f2851c'},{id:'sophia',name:'Sophia',color:'#f2b705'},
 {id:'fred',name:'Fred',color:'#2f7ff0'},{id:'selina',name:'Selina',color:'#17b5c9'},
 {id:'jerome',name:'Jerome',color:'#7a52f0'},{id:'moni',name:'Moni',color:'#c25ef0'}
];
const P=Object.fromEntries(PEOPLE.map(p=>[p.id,p]));
const $=id=>document.getElementById(id);

// ================= Speicher / Bilder =================
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let me=lsGet('bb_me',null);if(me&&!P[me])me=null;
let myBest=lsGet('bb_best3',0);
let board=lsGet('bb_board',{best:[],today:[],games:{}});
const IMG={};
PEOPLE.forEach(p=>{const im=new Image();im.onload=()=>{IMG[p.id]=im;avTex.clear();renderLists();if(G)refreshAvatars()};im.src='img/'+p.id+'.jpg'});
function avHTML(id){const p=P[id];return IMG[id]?'<span class="av" style="background-image:url(img/'+id+'.jpg);background-color:'+p.color+'"></span>':'<span class="av" style="background:'+p.color+'">'+p.name[0]+'</span>'}

// ================= Three Setup =================
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const SKY=new THREE.Color('#9cc9f5');
scene.background=skyTexture();
scene.fog=new THREE.Fog(SKY,55,120);
const camera=new THREE.PerspectiveCamera(55,1,0.1,300);
const CAM_POS=new THREE.Vector3(0,12.5,17),CAM_LOOK=new THREE.Vector3(0,0,-10.5);
camera.position.copy(CAM_POS);camera.lookAt(CAM_LOOK);

scene.add(new THREE.HemisphereLight('#ffffff','#9db8e8',1.15));
const sun=new THREE.DirectionalLight('#fff4e0',1.9);
sun.position.set(8,22,14);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-14,right:14,top:30,bottom:-30,near:1,far:70});
sun.target.position.set(0,0,-12);scene.add(sun,sun.target);

function skyTexture(){const c=document.createElement('canvas');c.width=2;c.height=256;const g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#4f8fe0');gr.addColorStop(.55,'#9cc9f5');gr.addColorStop(1,'#e6f2ff');g.fillStyle=gr;g.fillRect(0,0,2,256);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}

// ---------- Geometrie-Helfer (Vertex-Farben + Mergen) ----------
function tint(geo,hex){geo=geo.index?geo.toNonIndexed():geo;const c=new THREE.Color(hex);const n=geo.attributes.position.count;const a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c.r;a[i*3+1]=c.g;a[i*3+2]=c.b}geo.setAttribute('color',new THREE.BufferAttribute(a,3));if(geo.attributes.uv)geo.deleteAttribute('uv');return geo}
function merge(list){let n=0;list.forEach(g=>n+=g.attributes.position.count);const pos=new Float32Array(n*3),nor=new Float32Array(n*3),col=new Float32Array(n*3);let o=0;for(const g of list){pos.set(g.attributes.position.array,o*3);nor.set(g.attributes.normal.array,o*3);col.set(g.attributes.color.array,o*3);o+=g.attributes.position.count}const m=new THREE.BufferGeometry();m.setAttribute('position',new THREE.BufferAttribute(pos,3));m.setAttribute('normal',new THREE.BufferAttribute(nor,3));m.setAttribute('color',new THREE.BufferAttribute(col,3));m.computeBoundingSphere();return m}
const T=(g,x,y,z)=>{g.translate(x,y,z);return g};
const R=(g,ax,ay,az)=>{if(ax)g.rotateX(ax);if(ay)g.rotateY(ay);if(az)g.rotateZ(az);return g};
const VC=new THREE.MeshLambertMaterial({vertexColors:true});
const VCs=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.8,metalness:0});

// ---------- Welt ----------
const Z_CANNON=8,Z_BASE=-29,TRACK_W=11;
function buildWorld(){
  // Boden (Schnee)
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshLambertMaterial({color:'#f2f7ff'}));
  ground.rotation.x=-Math.PI/2;ground.position.y=-0.6;ground.receiveShadow=true;scene.add(ground);
  // Strecke
  const trackLen=60;
  const tex=trackTexture();tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.repeat.set(1,trackLen/11);
  const track=new THREE.Mesh(new THREE.BoxGeometry(TRACK_W,0.6,trackLen),[0,0,new THREE.MeshLambertMaterial({map:tex}),0,0,0].map(m=>m||new THREE.MeshLambertMaterial({color:'#c9d9f2'})));
  track.position.set(0,-0.3,-12);track.receiveShadow=true;scene.add(track);
  // Zuckerstangen-Bande
  const rtex=stripeTexture();rtex.wrapS=rtex.wrapT=THREE.RepeatWrapping;rtex.repeat.set(1,24);
  for(const s of [-1,1]){const rail=new THREE.Mesh(new THREE.CylinderGeometry(0.22,0.22,trackLen,12),new THREE.MeshLambertMaterial({map:rtex}));rail.rotation.x=Math.PI/2;rail.position.set(s*(TRACK_W/2+0.1),0.15,-12);rail.castShadow=true;scene.add(rail)}
  // Tannen (instanced)
  const treeGeo=merge([
    tint(T(new THREE.CylinderGeometry(.22,.28,1,8),0,.5,0),'#7a4a24'),
    tint(T(new THREE.ConeGeometry(1.5,2.2,9),0,1.9,0),'#1f8a4c'),
    tint(T(new THREE.ConeGeometry(1.15,1.8,9),0,2.9,0),'#23995a'),
    tint(T(new THREE.ConeGeometry(.8,1.5,9),0,3.8,0),'#27a862'),
    tint(T(new THREE.ConeGeometry(.42,.6,9),0,4.45,0),'#ffffff'),
  ]);
  const N=64;const trees=new THREE.InstancedMesh(treeGeo,VC,N);trees.castShadow=true;
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),s=new THREE.Vector3(),p=new THREE.Vector3();
  let k=0;for(let z=14;z>-80&&k<N;z-=5.2){for(const side of [-1,1]){if(k>=N)break;const off=TRACK_W/2+2.2+Math.random()*7;const sc=0.8+Math.random()*0.7;p.set(side*off,-0.6,z+Math.random()*3);q.setFromEuler(new THREE.Euler(0,Math.random()*6,0));s.set(sc,sc,sc);m.compose(p,q,s);trees.setMatrixAt(k++,m)}}
  trees.count=k;scene.add(trees);
  // Geschenke am Rand
  const giftCols=['#e5394f','#2f7ff0','#2fbf71','#f2b705','#c25ef0'];
  for(let i=0;i<10;i++){const c=giftCols[i%5];const sz=.6+Math.random()*.5;const g=merge([tint(new THREE.BoxGeometry(sz,sz,sz),c),tint(new THREE.BoxGeometry(sz+.02,sz+.02,.14),'#fff'),tint(new THREE.BoxGeometry(.14,sz+.02,sz+.02),'#fff')]);const mesh=new THREE.Mesh(g,VC);mesh.position.set((i%2?1:-1)*(TRACK_W/2+1+Math.random()*1.2),-0.6+sz/2,6-i*5.5);mesh.rotation.y=Math.random();mesh.castShadow=true;scene.add(mesh)}
  // Schneefall
  const sn=700,sp=new Float32Array(sn*3);for(let i=0;i<sn;i++){sp[i*3]=(Math.random()-.5)*50;sp[i*3+1]=Math.random()*30;sp[i*3+2]=-60+Math.random()*85}
  const sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  snow=new THREE.Points(sg,new THREE.PointsMaterial({map:dotTex(),color:'#fff',size:.32,transparent:true,opacity:.95,depthWrite:false,alphaTest:.01}));scene.add(snow);
}
let snow;
function dotTex(){const c=document.createElement('canvas');c.width=c.height=32;const g=c.getContext('2d');const gr=g.createRadialGradient(16,16,0,16,16,16);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.5,'rgba(255,255,255,.8)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,32,32);return new THREE.CanvasTexture(c)}
function trackTexture(){const c=document.createElement('canvas');c.width=256;c.height=256;const g=c.getContext('2d');g.fillStyle='#e9f1fd';g.fillRect(0,0,256,256);g.fillStyle='#dbe7f9';for(let i=0;i<256;i+=64)g.fillRect(0,i,256,32);g.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<40;i++){g.beginPath();g.arc(Math.random()*256,Math.random()*256,Math.random()*3+1,0,7);g.fill()}const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}
function stripeTexture(){const c=document.createElement('canvas');c.width=32;c.height=32;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,32,32);g.fillStyle='#e5394f';g.beginPath();g.moveTo(0,0);g.lineTo(16,0);g.lineTo(32,16);g.lineTo(32,32);g.closePath();g.fill();g.beginPath();g.moveTo(0,16);g.lineTo(16,32);g.lineTo(0,32);g.closePath();g.fill();const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t}

// ---------- Figuren ----------
const MAXU=900,MAXE=160,MAXP=500;
let unitMesh=null,enemyMesh,partMesh;
function wichtelGeo(col){
  return merge([
    tint(T(new THREE.CapsuleGeometry(.2,.22,2,8),0,.38,0),col),         // Körper
    tint(T(new THREE.SphereGeometry(.17,9,6),0,.78,0),'#ffd9b8'),        // Kopf
    tint(T(new THREE.ConeGeometry(.17,.36,8),0,1.03,0),col),            // Mütze
    tint(T(new THREE.SphereGeometry(.065,5,3),0,1.22,0),'#ffffff'),      // Bommel
    tint(T(new THREE.CylinderGeometry(.18,.18,.07,8,1,true),0,.88,0),'#ffffff'),
    tint(T(new THREE.SphereGeometry(.032,4,2),-.06,.8,-.15),'#222'),      // Augen (Richtung Burg)
    tint(T(new THREE.SphereGeometry(.032,4,2),.06,.8,-.15),'#222'),
  ]);
}
function krampusGeo(){
  return merge([
    tint(T(new THREE.CapsuleGeometry(.22,.24,2,8),0,.4,0),'#5b1b3a'),
    tint(T(new THREE.SphereGeometry(.19,9,6),0,.82,0),'#8f2350'),
    tint(R(T(new THREE.ConeGeometry(.06,.3,6),-.12,1.05,0),0,0,.45),'#f3e2c0'),
    tint(R(T(new THREE.ConeGeometry(.06,.3,6),.12,1.05,0),0,0,-.45),'#f3e2c0'),
    tint(T(new THREE.SphereGeometry(.045,6,5),-.07,.85,.16),'#ffd54a'),
    tint(T(new THREE.SphereGeometry(.045,6,5),.07,.85,.16),'#ffd54a'),
  ]);
}
function makeUnitMesh(col){
  if(unitMesh){scene.remove(unitMesh);unitMesh.geometry.dispose()}
  unitMesh=new THREE.InstancedMesh(wichtelGeo(col),VC,MAXU);unitMesh.count=0;unitMesh.frustumCulled=false;
  unitMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(unitMesh);
}
function buildActors(){
  enemyMesh=new THREE.InstancedMesh(krampusGeo(),VC,MAXE);enemyMesh.count=0;enemyMesh.frustumCulled=false;enemyMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);scene.add(enemyMesh);
  partMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(.16,.16,.16),new THREE.MeshBasicMaterial(),MAXP);partMesh.count=0;partMesh.frustumCulled=false;

function update(dt){
  const L=G.level;
  // Kanone
  G.cx+=(G.tx-G.cx)*Math.min(1,dt*14);
  cannon.position.x=G.cx;G.recoil=Math.max(0,G.recoil-dt*10);cannonBarrel.position.z=-.3+G.recoil*.22;
  cannonAv.position.y=2.75+Math.sin(performance.now()/300)*.06;
  // Tore
  for(const g of G.gates){if(g.vx){g.x+=g.vx*dt;if(g.x>g.lim){g.x=g.lim;g.vx=-g.vx}if(g.x<-g.lim){g.x=-g.lim;g.vx=-g.vx}g.obj.position.x=g.x}
    g.flash=Math.max(0,g.flash-dt*4);g.panel.material.opacity=.42+g.flash*.35;g.obj.scale.setScalar(1+g.flash*.06)}
  if(G.state==='play'){
    G.playMs+=dt*1000;
    if(G.hold){G.fireAcc+=dt;const iv=.118/Math.pow(1.25,G.up.rate);while(G.fireAcc>=iv){fire();G.fireAcc-=iv}}else G.fireAcc=0;
    G.spawnAcc-=dt;if(G.spawnAcc<=0){spawnWave();G.spawnAcc=G.spawnEvery*(.8+Math.random()*.4)}
  }
  // Einheiten
  const spd=9.5*dt,lastGateZ=G.gates.reduce((a,g)=>Math.min(a,g.z),0)-1;
  for(let k=0;k<U.n;k++){
    const pz=U.z[k];U.z[k]-=spd;U.ph[k]+=dt*14;U.born[k]=Math.min(1,U.born[k]+dt*6);
    U.x[k]+=U.vx[k]*dt;if(U.x[k]>5){U.x[k]=5;U.vx[k]=-Math.abs(U.vx[k])}if(U.x[k]<-5){U.x[k]=-5;U.vx[k]=Math.abs(U.vx[k])}
    if(U.z[k]<lastGateZ){U.vx[k]*=.96;const dx=-U.x[k]*.9;U.x[k]+=Math.sign(dx)*Math.min(Math.abs(dx),2.6*dt)}
    for(const g of G.gates){
      if(!(U.m[k]&g.bit)&&pz>=g.z&&U.z[k]<g.z&&Math.abs(U.x[k]-g.x)<=g.w/2){
        U.m[k]|=g.bit;g.flash=1;
        for(let c=1;c<g.mul&&U.n<MAXU;c++){const n=U.n++;U.vx[n]=(Math.random()-.5)*2.6;U.x[n]=Math.max(-5,Math.min(5,U.x[k]+(Math.random()-.5)*1.1));U.z[n]=U.z[k]-Math.random()*.6;U.m[n]=U.m[k];U.ph[n]=Math.random()*6;U.born[n]=0}
        tone(700+g.mul*90,.06,'sine',.035,'gate',40);
      }
    }
  }
  // Kampf Einheiten vs Gegner
  for(let e=0;e<E.n;e++){
    const r=E.big[e]?1.3:.52,r2=r*r,ex=E.x[e],ez=E.z[e];
    for(let k=0;k<U.n;k++){
      const dz=U.z[k]-ez;if(dz>r||dz<-r)continue;const dx=U.x[k]-ex;
      if(dx*dx+dz*dz<r2){removeUnit(k);k--;E.hp[e]-=1;if(E.hp[e]<=0)break}
    }
    if(E.hp[e]<=0){killEnemy(e);e--}
  }
  // Einheiten an der Burg
  for(let k=0;k<U.n;k++){if(U.z[k]<=Z_BASE+1.2){if(Math.abs(U.x[k])<3.7){hitBase(1,U.x[k],U.z[k]);if(Math.random()<.3)burst(U.x[k],.8,Z_BASE+1,P[me].color,2,2)}removeUnit(k);k--}}
  // Champions
  for(let i=champs.length-1;i>=0;i--){
    const c=champs[i];const pz=c.z;c.z-=4.2*dt;c.ph+=dt*8;
    if(c.z<lastGateZ){c.x+=(-c.x)*Math.min(1,dt*1.5)}
    for(const g of G.gates){if(!(c.m&g.bit)&&pz>=g.z&&c.z<g.z&&Math.abs(c.x-g.x)<=g.w/2+.5){c.m|=g.bit;g.flash=1;const n=g.mul*6;for(let q=0;q<n&&U.n<MAXU;q++){const k=U.n++;U.vx[k]=(Math.random()-.5)*3;U.x[k]=Math.max(-5,Math.min(5,c.x+(Math.random()-.5)*2.5));U.z[k]=c.z-Math.random();U.m[k]=c.m;U.ph[k]=Math.random()*6;U.born[k]=0}tone(500,.2,'triangle',.06,null,0,1200)}}
    for(let e=0;e<E.n;e++){const r=E.big[e]?1.8:1.1;const dx=E.x[e]-c.x,dz=E.z[e]-c.z;if(dx*dx+dz*dz<r*r){const d=Math.min(E.hp[e],c.hp);E.hp[e]-=d;c.hp-=Math.max(1,Math.ceil(d/4));if(E.hp[e]<=0){killEnemy(e);e--}if(c.hp<=0)break}}
    let gone=false;
    if(c.hp<=0){burst(c.x,1.5,c.z,'#ffd54a',40,6);gone=true}
    else if(c.z<=Z_BASE+1.6){const dmg=c.hp*3+20;hitBase(dmg,c.x,c.z);burst(c.x,2,c.z,'#ffd54a',60,8);G.shake=1;buzz(40);tone(80,.5,'sawtooth',.09);gone=true}
    if(gone){scene.remove(c.obj);champs.splice(i,1);continue}
    c.obj.position.set(c.x,Math.abs(Math.sin(c.ph))*.25,c.z);c.glow.rotation.z+=dt*2;
  }
  // Gegner bewegen
  for(let e=0;e<E.n;e++){
    E.ph[e]+=dt*(E.big[e]?7:12);
    E.z[e]+=G.eSpeed*(E.big[e]?.6:1)*dt;
    const dx=E.tx[e]-E.x[e];E.x[e]+=Math.sign(dx)*Math.min(Math.abs(dx),.9*dt);
    if(E.z[e]>=Z_CANNON-.6){
      const big=E.big[e];const ex=E.x[e];E.hp[e]=0;
      const last=--E.n;E.x[e]=E.x[last];E.z[e]=E.z[last];E.hp[e]=E.hp[last];E.max[e]=E.max[last];E.big[e]=E.big[last];E.ph[e]=E.ph[last];E.tx[e]=E.tx[last];e--;
      if(G.state==='play'){G.hearts-=big?2:1;G.shake=1.2;buzz([60,40,80]);tone(110,.35,'sawtooth',.09);burst(ex,.8,Z_CANNON-.5,'#e5394f',24,5);floatText(ex,1.5,Z_CANNON-1,big?'-2 ❤️':'-1 ❤️','#ff5a6e',24);updHud();if(G.hearts<=0){gameOver();return}}
    }
  }
  // Burg erobert?
  if(G.state==='play'&&G.base.hp<=0){
    G.base.hp=0;G.state='won';G.timer=1.8;G.hold=false;
    const bonus=50*L;addScore(bonus);
    for(let i=0;i<6;i++)burst((Math.random()-.5)*7,2+Math.random()*3,Z_BASE-1,i%2?'#6b2a4f':'#ffd54a',30,9);
    for(let e=0;e<E.n;e++)burst(E.x[e],.6,E.z[e],'#8f2350',4,3);E.n=0;
    G.shake=1.6;buzz([40,30,120]);
    [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>tone(f,.28,'triangle',.08),i*100));
    banner('BURG EROBERT!','+'+bonus+' Bonus');
    castle.visible=false;
  }
  if(G.state==='intro'){G.timer-=dt;if(G.timer<=0)G.state='play'}
  if(G.state==='won'){G.timer-=dt;if(G.timer<=0){G.state='pick';showUpgrades()}}
  // Partikel
  for(let k=0;k<PT.n;k++){PT.vy[k]-=18*dt;PT.x[k]+=PT.vx[k]*dt;PT.y[k]+=PT.vy[k]*dt;PT.z[k]+=PT.vz[k]*dt;if(PT.y[k]<0){PT.y[k]=0;PT.vy[k]*=-.3;PT.vx[k]*=.7;PT.vz[k]*=.7}PT.l[k]-=dt*1.4;
    if(PT.l[k]<=0){const l=--PT.n;PT.x[k]=PT.x[l];PT.y[k]=PT.y[l];PT.z[k]=PT.z[l];PT.vx[k]=PT.vx[l];PT.vy[k]=PT.vy[l];PT.vz[k]=PT.vz[l];PT.l[k]=PT.l[l];partMesh.instanceColor.setXYZ(k,partMesh.instanceColor.getX(l),partMesh.instanceColor.getY(l),partMesh.instanceColor.getZ(l));k--}}
  castleFlash=Math.max(0,castleFlash-dt*6);castleMat.emissiveIntensity=castleFlash*.35;
  if(castle.visible)castle.position.x=castleFlash>0?(Math.random()-.5)*.12:0;
  if(G.hudDirty){G.hudDirty=false;updHud()}
  $('champFill').style.width=(100*G.charge/champNeed())+'%';
}

// ================= Rendern =================
const M4=new THREE.Matrix4(),Q=new THREE.Quaternion(),S=new THREE.Vector3(),PV=new THREE.Vector3(),EU=new THREE.Euler();
const QB=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,Math.PI,0));
function syncInstances(){
  if(unitMesh)for(let k=0;k<U.n;k++){
    const b=U.born[k],sc=(.4+.6*b)*1.3;const hop=Math.abs(Math.sin(U.ph[k]))*.16;
    EU.set(0,0,Math.sin(U.ph[k])*.12);Q.setFromEuler(EU);
    PV.set(U.x[k],hop,U.z[k]);S.set(sc,sc*(1+(1-b)*.3),sc);M4.compose(PV,Q,S);unitMesh.setMatrixAt(k,M4);
  }
  if(unitMesh){unitMesh.count=U.n;unitMesh.instanceMatrix.needsUpdate=true}
  for(let e=0;e<E.n;e++){
    const big=E.big[e];const sc=big?3.2:1.3;const hop=Math.abs(Math.sin(E.ph[e]))*(big?.25:.12);
    EU.set(0,0,Math.sin(E.ph[e])*.1);Q.setFromEuler(EU);
    PV.set(E.x[e],hop,E.z[e]);S.set(sc,sc,sc);M4.compose(PV,Q,S);enemyMesh.setMatrixAt(e,M4);
  }
  enemyMesh.count=E.n;enemyMesh.instanceMatrix.needsUpdate=true;
  for(let k=0;k<PT.n;k++){const s=Math.max(.05,PT.l[k]);PV.set(PT.x[k],PT.y[k],PT.z[k]);S.set(s,s,s);EU.set(PT.l[k]*5,PT.l[k]*3,0);Q.setFromEuler(EU);M4.compose(PV,Q,S);partMesh.setMatrixAt(k,M4)}
  partMesh.count=PT.n;partMesh.instanceMatrix.needsUpdate=true;partMesh.instanceColor.needsUpdate=true;
}
function placeHpLabel(){
  if(!G||!castle||!castle.visible){$('hpLbl').style.opacity=0;return}
  const [sx,sy]=toScreen(0,8.8,Z_BASE-1);const l=$('hpLbl');l.style.opacity=1;l.style.left=sx+'px';l.style.top=sy+'px';
  $('hpName').textContent=P[G.base.boss].name+'s Burg';
  $('hpFill').style.width=(100*Math.max(0,G.base.hp)/G.base.max)+'%';$('hpTxt').textContent=Math.max(0,Math.ceil(G.base.hp))+' / '+G.base.max;
}
function animSnow(dt){const a=snow.geometry.attributes.position;for(let i=0;i<a.count;i++){let y=a.getY(i)-dt*2.2;if(y<0)y=30;a.setY(i,y);a.setX(i,a.getX(i)+Math.sin(y+i)*dt*.3)}a.needsUpdate=true}

let menuT=0;
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  // Strecke soll an der Kanone voll ins Bild passen
  const dist=CAM_POS.distanceTo(new THREE.Vector3(0,0,Z_CANNON));
  const hf=2*Math.atan(6.3/dist);let vf=2*Math.atan(Math.tan(hf/2)/camera.aspect)*180/Math.PI;
  camera.fov=Math.max(48,Math.min(78,vf));camera.updateProjectionMatrix();
}
addEventListener('resize',resize);

let last=performance.now();
function loop(now){
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;
  if(G&&G.state!=='over'&&G.state!=='pick')update(dt);
  animSnow(dt);
  // Kamera
  if(G){const sh=G.shake;G.shake=Math.max(0,G.shake-dt*3);camera.position.set(CAM_POS.x+(Math.random()-.5)*sh*.5,CAM_POS.y+(Math.random()-.5)*sh*.5,CAM_POS.z);camera.lookAt(CAM_LOOK)}
  else{menuT+=dt;camera.position.set(Math.sin(menuT*.15)*3,CAM_POS.y,CAM_POS.z);camera.lookAt(CAM_LOOK)}
  syncInstances();
  renderer.render(scene,camera);
  placeHpLabel();
  requestAnimationFrame(loop);
}

// ================= Upgrades =================
function showUpgrades(){
  const avail=UPGRADES.filter(u=>G.up[u.id]<u.max);
  for(let i=avail.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[avail[i],avail[j]]=[avail[j],avail[i]]}
  const box=$('cards');box.innerHTML='';
  $('upgSub').textContent=P[G.base.boss].name+' ist besiegt! Wähle einen Bonus:';
  avail.slice(0,3).forEach(u=>{const b=document.createElement('button');b.className='card';b.innerHTML='<span class="ic">'+u.ic+'</span><span><b>'+u.t+'</b><small>'+u.d+'</small></span>';
    b.onclick=()=>{audioOn();G.up[u.id]++;if(u.id==='heart'){G.maxHearts++;G.hearts++}tone(880,.15,'triangle',.08);G.level++;castle.visible=true;showScreen(null);startLevel()};box.appendChild(b)});
  showScreen('upg');
}

// ================= Rangliste / Screens =================
function bestOf(id){const r=(board.best||[]).find(x=>x.player===id);return r?r.score:0}
function ranking(){return PEOPLE.map(p=>({id:p.id,s:bestOf(p.id)})).sort((a,b)=>b.s-a.s)}
function todayKing(){const t=board.today||[];return t.length?t[0].player:null}
function boardHTML(){
  const r=ranking(),king=todayKing();
  return '<h3><span>Rangliste</span><span>👑 Tagesbester</span></h3>'+r.map((x,i)=>'<div class="row'+(x.id===me?' mine':'')+'"><span class="rk">'+(x.s>0?(i===0?'🏆':i+1):'')+'</span>'+avHTML(x.id)+'<span class="n">'+P[x.id].name+(x.id===king?' 👑':'')+'</span><span class="s">'+(x.s>0?x.s.toLocaleString('de-DE'):'–')+'</span></div>').join('');
}
function renderLists(){
  $('board1').innerHTML=boardHTML();$('board2').innerHTML=boardHTML();
  if(me){$('meBox').innerHTML=avHTML(me)+'<span>'+P[me].name+'</span><button id="chg">ändern</button>';$('chg').onclick=()=>showScreen('who')}
  const pg=$('pickGrid');pg.innerHTML='';
  PEOPLE.forEach(p=>{const b=document.createElement('button');b.className='pick';b.innerHTML=avHTML(p.id)+p.name;b.onclick=()=>{me=p.id;lsSet('bb_me',me);myBest=0;lsSet('bb_best3',0);showScreen('start')};pg.appendChild(b)});
}
async function fetchBoard(){try{const r=await fetch(API,{cache:'no-store'});if(!r.ok)throw 0;board=await r.json();lsSet('bb_board',board);renderLists();return true}catch(e){return false}}
async function submit(score,level,dur){
  const pend=lsGet('bb_pending',[]);pend.push({player:me,score,level,duration_ms:Math.round(dur)});
  let ok=false;const rest=[];
  for(const s of pend){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(s)});const j=await r.json();if(j.ok){ok=true;if(j.board){board=j.board;lsSet('bb_board',board)}}else if(j.error==='too_fast')rest.push(s)}catch(e){rest.push(s)}}
  lsSet('bb_pending',rest.slice(-5));return ok;
}
function showScreen(id){
  for(const s of ['who','start','over','upg'])$(s).classList.toggle('hidden',s!==id);
  if(id==='start'||id==='who'){$('hud').classList.add('hidden');$('champ').classList.add('hidden');$('hpLbl').classList.add('hidden');$('hint').classList.add('hidden')}
  if(id==='start'){renderLists();fetchBoard();countdown();idleScene()}
  if(id==='who'){renderLists();if(!castle)idleScene()}
}
function idleScene(){
  G=null;U.n=0;E.n=0;PT.n=0;champs.forEach(c=>scene.remove(c.obj));champs=[];
  while(gateGroup.children.length)gateGroup.remove(gateGroup.children[0]);
  if(me){makeUnitMesh(P[me].color);buildCannon();cannon.position.x=0}
  buildCastle(PEOPLE[Math.floor(Math.random()*8)].id);castle.visible=true;
  [{x:-2.6,z:-6,w:3.4,mul:2},{x:2.6,z:-6,w:3.4,mul:3},{x:0,z:-18,w:4,mul:2}].forEach(g=>makeGate(g));
}
function countdown(){
  const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const d=Math.round((new Date(now.getFullYear(),11,28)-today)/864e5);const el=$('countdown');
  el.textContent=d<0?'Die Baumshow ist vorbei. Glückwunsch an den Pokalsieger! 🏆':d===0?'🏆 Heute ist Pokalvergabe! Letzte Chance!':'🏆 Pokalvergabe bei der Baumshow in '+d+' Tag'+(d>1?'en':'');
}
async function gameOver(){
  G.state='over';G.hold=false;
  const score=G.score,level=G.level,dur=G.playMs;
  const prev=Math.max(myBest,bestOf(me));const isRec=score>prev;if(score>myBest){myBest=score;lsSet('bb_best3',myBest)}
  banner('GAME OVER','');
  setTimeout(async()=>{
    showScreen('over');$('hud').classList.add('hidden');$('champ').classList.add('hidden');$('hpLbl').classList.add('hidden');
    $('oWho').textContent=P[me].name;$('oScore').textContent=score.toLocaleString('de-DE');$('oLevel').textContent='Level '+level+' erreicht';
    $('oRec').innerHTML=isRec&&score>0?'<span class="rec">Neuer Rekord!</span>':'<div class="sub">Dein Rekord: '+prev.toLocaleString('de-DE')+'</div>';
    $('oTaunt').textContent='';$('oNet').textContent='Wird gespeichert …';renderLists();
    const ok=await submit(score,level,dur);
    $('oNet').textContent=ok?'Online gespeichert ✓':'Gerade offline. Der Score wird beim nächsten Mal nachgereicht.';
    renderLists();$('oTaunt').textContent=taunt(score);
  },1100);
}
function taunt(score){
  const r=ranking();const i=r.findIndex(x=>x.id===me);const mine=r[i].s;
  if(i===0&&mine>0){const s=r[1];return s.s>0?'Der Pokal gehört gerade dir! '+P[s.id].name+' fehlen '+(mine-s.s).toLocaleString('de-DE')+' Punkte.':'Du führst. Jetzt sind die anderen dran.'}
  const a=r[i-1];return 'Noch '+(a.s-Math.max(score,mine)+1).toLocaleString('de-DE')+' Punkte bis '+P[a.id].name+' (Platz '+i+').';
}
function refreshAvatars(){if(cannonAv)cannonAv.material.map=avatarTexture(me);if(castleAv&&G)castleAv.material.map=avatarTexture(G.base.boss,'#ffd54a')}
$('play').onclick=()=>{audioOn();newGame()};
$('again').onclick=()=>{audioOn();newGame()};
$('toMenu').onclick=()=>showScreen('start');

// ================= Start =================
await document.fonts.load('700 64px Fredoka').catch(()=>{});
buildWorld();buildActors();resize();
if(!me)showScreen('who');else showScreen('start');
setInterval(()=>{if(!G)fetchBoard()},30000);
requestAnimationFrame(loop);
window.__bb={get G(){return G},U,E};
</script>
