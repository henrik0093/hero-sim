<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ölrausch">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Ölrausch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#0e0f11;--panel:#15171a;--card:#1b1e22;--card2:#20242a;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.12);
 --tx:#e9e6df;--mut:#8b9097;--amb:#e3a03b;--amb2:#c47f1c;--ambD:rgba(227,160,59,.14);--grn:#5fb98a;--red:#d8645a;--blu:#7fa9c9;
 --hd:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--bd:'Barlow',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);font-family:var(--bd);color:var(--tx);touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none;font-variant-numeric:tabular-nums}
#c{position:fixed;inset:0;display:block}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;color:inherit}
svg.i{display:inline-block;vertical-align:middle;flex:none}
.num{font-family:var(--hd);font-weight:600;letter-spacing:.02em}
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 16px);overflow-y:auto;touch-action:pan-y}
.ov.center{justify-content:center;background:rgba(6,7,8,.78);backdrop-filter:blur(2px)}
.ov.bottom{justify-content:flex-end;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.35) 35%,rgba(0,0,0,.8))}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:none;border-radius:10px;padding:15px 18px;margin-top:12px;font-family:var(--hd);font-weight:700;font-size:23px;letter-spacing:.14em;text-transform:uppercase;color:#1b1206;background:linear-gradient(#eeb04c,#c98420);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 24px rgba(227,160,59,.18)}
.btn:active{filter:brightness(.88)}
.btn.glow{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 34px rgba(227,160,59,.42)}}
.btn.sec{background:transparent;color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2);font-size:16px;letter-spacing:.1em;padding:13px}
.btn.green{background:linear-gradient(#6cc596,#3f9a6a);color:#07170e}
.buy{flex:none;border:none;border-radius:8px;padding:9px 8px;min-width:94px;font-family:var(--hd);font-weight:700;font-size:16px;letter-spacing:.04em;color:#1b1206;background:linear-gradient(#eeb04c,#c98420);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.buy:active{filter:brightness(.85)}
.buy.no{background:#262a30;color:#6d727a;box-shadow:inset 0 0 0 1px var(--line)}
.buy.max{background:transparent;color:var(--grn);box-shadow:inset 0 0 0 1px rgba(95,185,138,.4)}
.buy.on{background:linear-gradient(#6cc596,#3f9a6a);color:#07170e}
/* Hub */
#hub{position:fixed;inset:0;z-index:10}
.scroll{position:absolute;inset:0;overflow-y:auto;touch-action:pan-y;padding-bottom:calc(env(safe-area-inset-bottom) + 70px);-webkit-overflow-scrolling:touch}
.gap{height:max(31vh,215px);position:relative}
.regchip{position:absolute;left:14px;bottom:12px;display:flex;align-items:center;gap:8px;font-family:var(--hd);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#f2ede4;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.regchip i{font-style:normal;padding:2px 6px;border:1px solid rgba(255,255,255,.5);border-radius:4px;font-size:12px}
.regchip b{color:var(--amb)}
.hubtop{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 10px 0;display:flex;gap:8px;align-items:stretch;z-index:3;pointer-events:none;max-width:460px;margin:0 auto}
.hubtop>*{pointer-events:auto}
.money{flex:1;min-width:0;background:rgba(14,15,17,.82);backdrop-filter:blur(6px);border:1px solid var(--line2);border-radius:10px;padding:6px 12px}
.money b{display:block;font-family:var(--hd);font-weight:700;font-size:28px;line-height:1.05;color:#f4efe6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money small{font-size:11.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em}
.money small b{display:inline;font-size:11.5px;font-family:var(--bd);font-weight:600;color:var(--amb)}
.tchip{background:rgba(14,15,17,.82);backdrop-filter:blur(6px);border:1px solid var(--line2);border-radius:10px;padding:4px 10px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:52px}
.tchip small{font-size:9.5px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.tchip b{font-family:var(--hd);font-size:21px;font-weight:700;line-height:1.1;display:flex;align-items:center;gap:4px}
.tchip.gold b{color:var(--amb)}
#uLvlBar{width:100%;height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:2px;overflow:hidden}
#uLvlBar div{height:100%;background:var(--blu)}
.snd{width:40px;border-radius:10px;border:1px solid var(--line2);background:rgba(14,15,17,.82);color:var(--mut);flex:none;display:flex;align-items:center;justify-content:center}
.panel{max-width:460px;margin:0 auto;background:var(--panel);border-radius:14px 14px 0 0;min-height:calc(100vh - max(31vh,215px));padding:16px 14px 22px;box-shadow:0 -20px 40px rgba(0,0,0,.45);border-top:1px solid var(--line2)}
.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;background:rgba(12,13,15,.97);border-top:1px solid var(--line);padding:4px 6px calc(env(safe-area-inset-bottom) + 4px);z-index:4}
.tab{flex:1;max-width:110px;border:none;background:none;color:#6f747b;font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;padding:7px 0 5px;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab.on{color:var(--amb)}
.tab.on:before{content:'';position:absolute;top:-4px;left:28%;right:28%;height:2px;background:var(--amb);border-radius:2px}
.tab.lock{opacity:.4}
.badge{position:absolute;top:3px;left:58%;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-style:normal;line-height:16px;padding:0 4px;letter-spacing:0;font-weight:700}
.brand{display:flex;align-items:baseline;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:10px}
.logo{font-family:var(--hd);font-weight:700;font-size:30px;letter-spacing:.22em;color:#f4efe6;line-height:1}
.logo span{color:var(--amb)}
.brand small{font-size:11px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.stats div{background:var(--card);padding:8px 10px}
.stats small{display:block;font-size:10px;letter-spacing:.14em;color:var(--mut);text-transform:uppercase}
.stats b{font-family:var(--hd);font-size:21px;font-weight:600}
h3{font-family:var(--hd);font-weight:600;font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);margin:22px 2px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
h3 small{letter-spacing:.02em;text-transform:none;font-family:var(--bd);font-weight:500;font-size:11.5px;opacity:.85;text-align:right}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:7px}
.item{display:flex;align-items:center;gap:11px}
.ic{width:40px;height:40px;border-radius:8px;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--amb)}
.tx{flex:1;min-width:0}
.tx b{font-weight:600;font-size:14.5px;display:block}
.tx small{font-size:12px;color:var(--mut);display:block;margin-top:1px}
.tx small em{font-style:normal;color:var(--grn);font-weight:600}
.lv{font-family:var(--hd);font-size:13px;color:var(--amb);font-weight:600;letter-spacing:.06em;margin-left:4px}
.pips{display:flex;gap:2px;margin-top:8px}
.pips i{flex:1;height:3px;border-radius:1px;background:rgba(255,255,255,.08)}
.pips i.f{background:var(--amb2)}
.bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden}
.bar>div{height:100%;background:var(--amb);transition:width .35s}
.mis .t{display:flex;justify-content:space-between;font-size:14px;gap:8px;align-items:baseline}
.mis .t i{font-style:normal;font-family:var(--hd);font-size:15px;color:var(--tx);white-space:nowrap}
.mis small{display:block;font-size:11.5px;color:var(--mut);margin-top:5px}
.mis small b{color:var(--amb);font-weight:600}
.mis.done{border-color:rgba(95,185,138,.35)}
.boosts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bst{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:9px 3px 7px;font-size:11px;font-weight:600;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--tx)}
.bst svg{color:var(--amb)}
.bst small{font-weight:400;color:var(--mut);font-size:10px}
.bst i{font-style:normal;font-family:var(--hd);color:var(--amb);font-size:13px;display:flex;align-items:center;gap:3px}
.bst.on{border-color:var(--grn);background:rgba(95,185,138,.1)}
.bst.no{opacity:.4}
.locked{font-size:12.5px;color:var(--mut);padding:12px;text-align:center;display:flex;align-items:center;justify-content:center;gap:8px}
.alb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.alb div{background:var(--card2);border:1px solid var(--line);border-radius:8px;padding:8px 2px 6px;font-size:10px;font-weight:500;line-height:1.2;min-height:70px;text-align:center;color:var(--tx)}
.alb div span{display:block;font-size:25px;line-height:1.3;filter:grayscale(1) sepia(.75) saturate(1.3) brightness(.95) contrast(1.1)}
.alb div.no span{filter:grayscale(1) brightness(0) opacity(.28)}
.alb div.no{color:#5d6168}
.reg.act{border-color:rgba(95,185,138,.45)}
.code{font-family:var(--hd);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--tx)}
canvas.chart{width:100%;height:80px;display:block;margin-top:6px;border-radius:6px;background:#121417;border:1px solid var(--line)}
.lager{height:10px;border-radius:3px;background:#121417;border:1px solid var(--line);overflow:hidden;margin-top:10px}
.lager div{height:100%;background:linear-gradient(90deg,#3a2c18,#6b4a1e);transition:width .3s}
.kv{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-top:5px;letter-spacing:.04em}
.kv b{color:var(--tx);font-weight:600}
.warn{color:var(--red);font-weight:600;font-size:12.5px;margin-top:8px;display:flex;align-items:center;gap:6px}
.note{font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.4}
/* HUD */
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 0;z-index:5;pointer-events:none}
.hrow{display:flex;gap:6px;align-items:stretch}
.hc{background:rgba(10,11,13,.66);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:8px;padding:4px 10px;display:flex;flex-direction:column;justify-content:center}
.hc small{font-size:9px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.hc b{font-family:var(--hd);font-size:20px;font-weight:600;line-height:1.1}
.hc b span{font-size:13px;color:var(--amb);margin-left:6px;font-weight:500}
.hc.depth{flex:1;align-items:center}
.hc.depth b{font-size:30px;font-weight:700;letter-spacing:.04em}
.hc.st b{color:var(--amb)}
#pause{pointer-events:auto;border:1px solid var(--line);background:rgba(10,11,13,.66);width:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--tx)}
.bars{display:flex;gap:6px;margin-top:6px}
.hb{flex:1;background:rgba(10,11,13,.66);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
.hb .lbl{display:flex;justify-content:space-between;font-size:9px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.hb .bar{margin-top:4px;height:5px}
#fuelB{background:var(--amb)}
#durB{background:#b9c3cc}
.hb.low{border-color:rgba(216,100,90,.8);animation:low .6s infinite}
@keyframes low{50%{background:rgba(120,30,25,.6)}}
#hRec{text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin-top:6px;text-shadow:0 1px 4px #000}
#hRec.new{color:var(--amb)}
#hBoost{display:flex;justify-content:center;gap:6px;margin-top:4px;color:var(--amb)}
/* Popups */
.pop{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:18px 16px;width:100%;max-width:360px;box-shadow:0 30px 70px rgba(0,0,0,.7)}
.pop.sheet{max-width:440px}
.phead{display:flex;align-items:center;gap:12px;text-align:left}
.phead .ic{width:46px;height:46px}
.phead small{display:block;font-size:10.5px;letter-spacing:.16em;color:var(--mut);text-transform:uppercase}
.phead h2{font-family:var(--hd);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase;line-height:1.05}
.lines{margin-top:12px}
.lines>div{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;font-size:14px;border-bottom:1px solid var(--line);gap:8px;color:var(--mut)}
.lines>div b{color:var(--tx);font-family:var(--hd);font-size:17px;font-weight:600;white-space:nowrap}
.total{font-family:var(--hd);font-size:46px;font-weight:700;color:var(--amb);margin-top:10px;line-height:1;text-align:center;letter-spacing:.02em}
.totl{text-align:center;font-size:10.5px;letter-spacing:.18em;color:var(--mut);text-transform:uppercase;margin-top:12px}
.rec{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:4px;border:1px solid var(--amb);color:var(--amb);font-family:var(--hd);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.hint{margin-top:10px;color:var(--mut);font-size:13px;text-align:center}
.hint b{color:var(--amb);font-weight:600}
.xp{margin-top:12px;font-size:12px}
.xp .row{display:flex;justify-content:space-between;color:var(--mut);letter-spacing:.06em}
.xp .row b{color:var(--tx)}
.xp .bar>div{background:var(--blu);transition:width .9s}
.lvup{margin-top:8px;padding:9px 10px;border-radius:8px;border:1px solid rgba(127,169,201,.4);background:rgba(127,169,201,.08);font-size:13px;display:flex;gap:10px;align-items:center;text-align:left}
.lvup b{font-family:var(--hd);font-size:17px;letter-spacing:.08em;color:var(--blu)}
.find{display:inline-block;margin:8px 4px 0 0;padding:3px 8px;border-radius:4px;border:1px solid rgba(127,169,201,.35);color:var(--blu);font-size:12px;font-weight:600}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 72px);transform:translate(-50%,-14px);opacity:0;transition:all .3s;z-index:60;background:rgba(20,22,25,.96);border:1px solid var(--line2);border-left:3px solid var(--grn);color:var(--tx);font-weight:500;padding:10px 14px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:13.5px;max-width:92vw;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{border-left-color:var(--red)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:14px 0 4px}
.days span{height:44px;border-radius:6px;background:var(--card2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9.5px;letter-spacing:.08em;color:var(--mut)}
.days span b{font-family:var(--hd);font-size:17px;color:var(--tx)}
.days span.on{border-color:var(--amb);background:var(--ambD)}
.days span.on b{color:var(--amb)}
.cd{height:3px;border-radius:2px;background:rgba(255,255,255,.1);margin-top:14px;overflow:hidden}
.cd div{height:100%;background:var(--red);width:100%}
.fly{position:fixed;z-index:70;width:8px;height:8px;border-radius:50%;background:var(--amb);box-shadow:0 0 10px var(--amb);pointer-events:none;transition:all .65s cubic-bezier(.5,-0.2,.7,1)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div class="hrow">
    <div class="hc"><small>Barrel</small><b id="hBar">0</b></div>
    <div class="hc depth"><small>Tiefe</small><b id="hDepth">0 m</b></div>
    <div class="hc st"><small>Serie</small><b id="hStreak">×1,0</b></div>
    <button id="pause" data-ic="pause"></button>
  </div>
  <div class="bars">
    <div class="hb" id="hbF"><div class="lbl"><span>Diesel</span><span id="fuelT"></span></div><div class="bar"><div id="fuelB" style="width:100%"></div></div></div>
    <div class="hb" id="hbD"><div class="lbl"><span>Bohrkopf</span><span id="durT"></span></div><div class="bar"><div id="durB" style="width:100%"></div></div></div>
  </div>
  <div id="hRec"></div><div id="hBoost"></div>
</div>
<div id="toast"></div>

<div id="hub" class="hidden">
  <div class="scroll" id="hubScroll">
    <div class="gap"><div class="regchip" id="regChip"></div></div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="hubtop">
    <div class="money"><b id="uMoney">$0</b><small id="uSub"></small></div>
    <div class="tchip gold"><small>Gold</small><b id="uGold">0</b></div>
    <div class="tchip"><small>Level</small><b id="uLv">1</b><div id="uLvlBar"><div></div></div></div>
    <button class="snd" id="bSound"></button>
  </div>
  <nav class="tabbar" id="tabbar">
    <button class="tab on" data-tab="drill"><span data-ic="drill"></span>Bohren<i class="badge hidden"></i></button>
    <button class="tab" data-tab="shop"><span data-ic="wrench"></span>Werkstatt<i class="badge hidden"></i></button>
    <button class="tab" data-tab="field"><span data-ic="derrick"></span>Ölfeld<i class="badge hidden"></i></button>
    <button class="tab" data-tab="ach"><span data-ic="trophy"></span>Erfolge<i class="badge hidden"></i></button>
  </nav>
</div>

<div id="sum" class="ov bottom hidden"><div class="pop sheet" id="sumBox"></div></div>

<div id="rev" class="ov center hidden">
  <div class="pop">
    <div class="phead"><div class="ic" data-ic="wrench"></div><div><small id="revT">Bohrkopf kaputt</small><h2>Notreparatur</h2></div></div>
    <div class="hint" style="text-align:left">Bohrkopf und Diesel werden auf 60 % gesetzt. Die Bohrung läuft weiter.</div>
    <button class="btn green" id="bRev">Reparieren · 3 Gold</button>
    <button class="btn sec" id="bRevNo">Bohrung beenden</button>
    <div class="cd"><div id="revCd"></div></div>
  </div>
</div>

<div id="pauseOv" class="ov center hidden">
  <div class="pop"><div class="phead"><div class="ic" data-ic="pause"></div><div><small>Bohrung</small><h2>Pausiert</h2></div></div><button class="btn" id="bResume">Weiter</button><button class="btn sec" id="bQuit">Bohrung beenden</button></div>
</div>

<div id="info" class="ov center hidden">
  <div class="pop"><div class="phead"><div class="ic" id="iIc"></div><div><small id="iS"></small><h2 id="iT"></h2></div></div><div id="iB"></div><button class="btn" id="bInfo">OK</button></div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,U=1;
const texCache={};
function resize(){DPR=Math.min(window.devicePixelRatio||1,2.5);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';U=Math.max(.75,Math.min(1.4,Math.min(W/400,H/720)))}

const rand=(a,b)=>a+Math.random()*(b-a);

function tex(ri,li){
 const k=ri+'-'+li;if(texCache[k])return texCache[k];
 const L=REG[ri].L[li],TS=512,c=document.createElement('canvas');c.width=c.height=TS;
 const x=c.getContext('2d');x.scale(DPR,DPR);const tw=TS/DPR,r=mulberry(hash(L.n+L.c+ri));
 const R=(a,b)=>a+r()*(b-a);
 const wrap=fn=>{for(const ox of[-tw,0,tw])for(const oy of[-tw,0,tw]){x.save();x.translate(ox,oy);fn();x.restore()}};
 x.fillStyle=L.c;x.fillRect(0,0,tw,tw);
 for(let i=0;i<1400;i++){x.fillStyle=r()<.5?'rgba(0,0,0,.1)':'rgba(255,255,255,.045)';const s=R(.5,1.8);x.fillRect(r()*tw,r()*tw,s,s)}
 const pebble=(px,py,rr,col,hl)=>{const e=R(.6,.9),ro=R(0,3);wrap(()=>{x.fillStyle=col;x.beginPath();x.ellipse(px,py,rr,rr*e,ro,0,TAU);x.fill();x.fillStyle=hl;x.beginPath();x.ellipse(px-rr*.3,py-rr*.3,rr*.35,rr*.22,0,0,TAU);x.fill()})};
 const line=(pts,col,w,blur)=>wrap(()=>{x.strokeStyle=col;x.lineWidth=w;x.lineCap='round';if(blur){x.shadowColor=col;x.shadowBlur=blur}x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();x.shadowBlur=0});
 const crack=(n,len)=>{let px=r()*tw,py=r()*tw,a=R(0,TAU);const pts=[[px,py]];for(let i=0;i<n;i++){a+=R(-.8,.8);px+=Math.cos(a)*len;py+=Math.sin(a)*len;pts.push([px,py])}return pts};
 const wavyH=(y,amp,k)=>{const pts=[];for(let i=0;i<=40;i++){const xx=i/40*tw;pts.push([xx,y+Math.sin(xx/tw*TAU*k)*amp])}return pts};
 switch(L.st){
  case'soil':for(let i=0;i<45;i++)pebble(r()*tw,r()*tw,R(1.2,4),L.s,'rgba(255,255,255,.07)');for(let i=0;i<7;i++)line(crack(6,R(5,9)),'rgba(15,8,3,.35)',R(.6,1.3));break;
  case'sand':for(let i=0;i<1600;i++){x.fillStyle=r()<.5?L.s:L.h;x.globalAlpha=.45;x.fillRect(r()*tw,r()*tw,1,1)}x.globalAlpha=1;for(let i=0;i<5;i++)line(wavyH(r()*tw,R(2,5),1+Math.floor(r()*3)),'rgba(0,0,0,.07)',R(1.5,3));for(let i=0;i<10;i++)pebble(r()*tw,r()*tw,R(1.2,2.6),L.s,'rgba(255,255,255,.12)');break;
  case'clay':for(let i=0;i<16;i++){const px=r()*tw,py=r()*tw,rr=R(10,26);wrap(()=>{const gg=x.createRadialGradient(px,py,0,px,py,rr);gg.addColorStop(0,L.s+'99');gg.addColorStop(1,L.s+'00');x.fillStyle=gg;x.beginPath();x.arc(px,py,rr,0,TAU);x.fill()})}for(let i=0;i<30;i++)pebble(r()*tw,r()*tw,R(1.2,3.5),L.h,'rgba(255,255,255,.1)');break;
  case'lime':for(let i=0;i<6;i++){const y=r()*tw,h=R(4,12),k=1+Math.floor(r()*2),col=(i%2?L.s:L.h)+'55';wrap(()=>{x.fillStyle=col;x.beginPath();for(let j=0;j<=40;j++){const xx=j/40*tw;x.lineTo(xx,y+Math.sin(xx/tw*TAU*k)*4)}for(let j=40;j>=0;j--){const xx=j/40*tw;x.lineTo(xx,y+h+Math.sin(xx/tw*TAU*k)*4)}x.fill()})}
   for(let i=0;i<8;i++){const px=r()*tw,py=r()*tw,rr=R(3,6);wrap(()=>{x.strokeStyle='rgba(255,255,255,.18)';x.lineWidth=1;x.beginPath();for(let a=0;a<12;a+=.3)x.lineTo(px+Math.cos(a)*rr*a/12,py+Math.sin(a)*rr*a/12);x.stroke()})}break;
  case'shale':for(let i=0;i<30;i++)line(wavyH(r()*tw,R(.5,2.5),1+Math.floor(r()*2)),i%2?L.s+'cc':L.h+'77',R(.6,2));for(let i=0;i<4;i++)line(crack(5,R(5,8)),'rgba(0,0,0,.3)',1);break;
  case'salt':for(let i=0;i<38;i++){const px=r()*tw,py=r()*tw,rr=R(4,12),n=4+Math.floor(r()*3),rot=R(0,3);wrap(()=>{x.fillStyle=L.h+'77';x.strokeStyle='rgba(255,255,255,.3)';x.lineWidth=.8;x.beginPath();for(let j=0;j<n;j++){const a=rot+j/n*TAU;x.lineTo(px+Math.cos(a)*rr,py+Math.sin(a)*rr*.8)}x.closePath();x.fill();x.stroke()})}break;
  case'granite':{const cols=[L.s,'#141212',L.h,'#8a6a6a','#c8c0b8'];for(let i=0;i<1700;i++){x.fillStyle=cols[Math.floor(r()*cols.length)];x.globalAlpha=R(.3,.75);const s=R(.8,2.8);x.fillRect(r()*tw,r()*tw,s,s)}x.globalAlpha=1;break}
  case'deep':for(let i=0;i<10;i++)line(crack(8,R(6,10)),'rgba(0,0,0,.45)',R(.8,1.8));for(let i=0;i<40;i++){x.fillStyle='rgba(220,200,230,.22)';x.fillRect(r()*tw,r()*tw,1,1)}break;
  case'magma':for(let i=0;i<9;i++)line(crack(9,R(6,11)),'#d8561c',R(1.2,2.6),8);for(let i=0;i<20;i++){x.fillStyle='rgba(230,140,50,.4)';x.beginPath();x.arc(r()*tw,r()*tw,R(.8,2),0,TAU);x.fill()}break;
  case'water':for(let i=0;i<22;i++){const px=r()*tw,py=r()*tw,rr=R(1.2,3.5);wrap(()=>{x.strokeStyle='rgba(255,255,255,.14)';x.lineWidth=.8;x.beginPath();x.arc(px,py,rr,0,TAU);x.stroke()})}for(let i=0;i<6;i++)line(wavyH(r()*tw,3,2),'rgba(255,255,255,.035)',4);break;
  case'ice':for(let i=0;i<20;i++){const px=r()*tw,py=r()*tw,rr=R(8,22),ro=R(0,3);wrap(()=>{x.fillStyle='rgba(255,255,255,.07)';x.beginPath();x.ellipse(px,py,rr,rr*.5,ro,0,TAU);x.fill()})}for(let i=0;i<12;i++)line(crack(5,R(6,12)),'rgba(255,255,255,.35)',R(.6,1.2));break;
  case'snow':for(let i=0;i<500;i++){x.fillStyle=r()<.5?'rgba(110,130,150,.25)':'rgba(255,255,255,.5)';x.fillRect(r()*tw,r()*tw,1.4,1.4)}break;
 }
 const p=ctx.createPattern(c,'repeat');texCache[k]=p;return p;
}

function genChunk(){

   const x=rand(r+8,W-r-8),y=rand(minY,y1);

  for(const a of pool){q-=a.w;if(q<=0){it=a;break}}

/* ---------- Update ---------- */
function update(dt){
 TT+=dt;
 if(G.hitStop>0){G.hitStop-=dt;dt*=.15}
 G.t+=dt;
 const D=G.d,R=REG[G.reg];
 if(G.mode==='run'){
  let tgt=0;
  if(touch.on)tgt=clamp((touch.x-D.x)/(W*.2),-1,1)*1.2;
  const tr=2.4+.1*S.up.motor;
  D.ang+=clamp(tgt-D.ang,-tr*dt,tr*dt);
  const dm0=D.y/PPM(),inWater=R.water&&dm0<R.water;
  const sp=G.speed*(G.inRock?.33:1)*(inWater?1.6:1);
  D.x+=Math.sin(D.ang)*sp*dt;D.y+=Math.cos(D.ang)*sp*dt;
  D.x=clamp(D.x,10*U,W-10*U);D.spin+=dt*(G.inRock?8:22);
  const lp=G.pipe[G.pipe.length-1];
  if(!lp||Math.hypot(lp.x-D.x,lp.y-D.y)>7*U)G.pipe.push({x:D.x,y:D.y});
  while(G.chunks*CH()<D.y+H*1.5)genChunk();
  if(G.inv>0)G.inv-=dt;
  const wasRock=G.inRock;G.inRock=false;
  const magR=G.boost.magnet?110*U:0;
  for(const o of G.objs){
   if(!o.alive||o.type==='fish')continue;
   if(Math.abs(o.y-D.y)>o.r+30*U+magR)continue;
   const d=Math.hypot(o.x-D.x,o.y-D.y);
   if(o.type==='rock'){if(d<o.r*.88)G.inRock=true}
   else if(o.type==='oil'){if(d<o.r+3*U)hitOil(o);else if(magR&&d<o.r+magR){const k=Math.min(1,180*U*dt/d);o.x+=(D.x-o.x)*k;o.y+=(D.y-o.y)*k}}
   else if(o.type==='gas'){if(d<o.r+3*U)hitGas(o)}
   else if(d<o.r+12*U)pickup(o);
  }

  h+=`<h3>Erfolge <small>Belohnung in Gold</small></h3>`;
  h+=ACH.map(a=>{const k=achTier(a),done=k>=a.t.length,t=done?a.t[a.t.length-1]:a.t[k],v=a.v(),ready=!done&&v>=t;
   return`<div class="card"><div class="item"><div class="ic">${ic(a.ic)}</div><div class="tx"><b>${a.n}<span class="lv">${k} / ${a.t.length}</span></b><small>${done?'Alle Stufen abgeschlossen':a.f(t)}</small>${done?'':`<div class="bar"><div style="width:${Math.min(100,v/t*100)}%"></div></div>`}</div>${done?`<button class="buy max">${ic('check',16,2.2)}</button>`:`<button class="buy ${ready?'on':'no'}" data-ach="${a.id}">${ready?'Abholen +'+a.g[k]:'+'+a.g[k]+' Gold'}</button>`}</div></div>`}).join('');
 }
 $('panel').innerHTML=h;
 const bd=$('bDrill');if(bd)bd.onclick=startRun;
 if(tab==='field')drawChart();
 updTop();
}
function updTop(){
 $('uMoney').textContent=fmt(S.money);
 const op=oilPrice();
 $('uSub').innerHTML=`Brent <b>$${dez(op.p,2)}</b>${op.boom?' · <b>Nachfragespitze</b>':''}${S.lvl>=FIELD_LV&&S.pumps?` · Lager ${Math.floor(S.lager/lagerCap(S.lagerLv)*100)} %`:''}`;
 $('uGold').innerHTML=ic('gold',15)+S.gold;
 $('uLv').textContent=S.lvl;$('uLvlBar').firstChild.style.width=Math.min(100,S.xp/xpNeed(S.lvl)*100)+'%';
 $('bSound').innerHTML=ic(S.sound?'snd':'mute',20);
 document.querySelectorAll('#panel .buy[data-c]').forEach(b=>b.classList.toggle('no',S.money<+b.dataset.c));
 const bad={shop:UPS.filter(u=>S.up[u.id]<MAXL&&S.money>=upCost(u,S.up[u.id])).length,
  field:S.lvl<FIELD_LV?0:((S.money>=pumpCost(S.pumps)?1:0)+(S.lager>=lagerCap(S.lagerLv)*.8?1:0)+REG.filter((r,i)=>!S.regs.includes(i)&&S.lvl>=r.lv&&S.money>=r.cost).length),
  ach:achCount(),drill:0};
 document.querySelectorAll('.tab').forEach(b=>{const n=bad[b.dataset.tab],i=b.querySelector('.badge');i.classList.toggle('hidden',!n);if(n)i.textContent=n});
 if(tab==='field'&&$('lagBar')){const cap=lagerCap(S.lagerLv);$('lagBar').style.width=(S.lager/cap*100)+'%';$('lagTx').textContent=Math.floor(S.lager/cap*100)+' %';$('lagVal').textContent=fmt(S.lager*op.p);$('pNow').textContent='$'+dez(op.p,2);const sb=$('bSell');if(sb)sb.className='buy '+(S.lager>=1?'on':'no')}
}
function drawChart(){
 const c=$('chart');if(!c)return;const w=c.clientWidth,h=c.clientHeight;if(!w)return;c.width=w*DPR;c.height=h*DPR;const x=c.getContext('2d');x.scale(DPR,DPR);
 const now=Date.now(),pts=[];for(let i=0;i<=90;i++)pts.push(oilPrice(now-(90-i)*2000));
 const vals=pts.map(p=>p.p),mn=Math.min(...vals)*.95,mx=Math.max(...vals)*1.05;
 x.strokeStyle='rgba(255,255,255,.05)';x.lineWidth=1;for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,h*i/4);x.lineTo(w,h*i/4);x.stroke()}
 pts.forEach((p,i)=>{if(p.boom){x.fillStyle='rgba(227,160,59,.1)';x.fillRect(i/90*w,0,w/90+1,h)}});
 x.beginPath();pts.forEach((p,i)=>x.lineTo(i/90*w,h-(p.p-mn)/(mx-mn)*h));
 x.strokeStyle='#e3a03b';x.lineWidth=1.6;x.stroke();
 x.lineTo(w,h);x.lineTo(0,h);x.closePath();const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(227,160,59,.18)');g.addColorStop(1,'rgba(227,160,59,0)');x.fillStyle=g;x.fill();
 const ly=h-(vals[90]-mn)/(mx-mn)*h;x.fillStyle='#f2ede4';x.beginPath();x.arc(w-4,ly,3,0,TAU);x.fill();
 x.fillStyle='rgba(255,255,255,.35)';x.font='10px Barlow, sans-serif';x.fillText('$'+dez(mx/1.05,0),4,11);x.fillText('$'+dez(mn/.95,0),4,h-4);
}
$('panel').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const lack=c=>{toast(`Es fehlen noch ${fmt(c-S.money)}`,1);sfx.err()};
 if(b.dataset.up){const u=UPS.find(x=>x.id===b.dataset.up),l=S.up[u.id];if(l>=MAXL)return;const c=upCost(u,l);if(S.money<c)return lack(c);S.money-=c;S.up[u.id]++;sfx.buy();buzz(12);flyFrom(b)}
 else if(b.dataset.pump){const c=pumpCost(S.pumps);if(S.money<c)return lack(c);S.money-=c;S.pumps++;sfx.buy();buzz(12);toast(S.pumps%10===0?'Ausbaubonus: alle Pumpen fördern ×1,5':'Neue Pumpe in Betrieb')}
 else if(b.dataset.lager){const c=lagerCost(S.lagerLv);if(S.money<c)return lack(c);S.money-=c;S.lagerLv++;sfx.buy();toast('Lager ausgebaut')}
 else if(b.id==='bSell'){sellLager(b)}
 else if(b.dataset.reg){const i=+b.dataset.reg,r=REG[i];if(S.money<r.cost)return lack(r.cost);S.money-=r.cost;S.regs.push(i);S.reg=i;sfx.level();toast(`Konzession erworben: ${r.n}`);newWorld()}
 else if(b.dataset.go){S.reg=+b.dataset.go;sfx.click();toast(`Standort: ${REG[S.reg].n}`);newWorld()}
 else if(b.dataset.ach){const a=ACH.find(x=>x.id===b.dataset.ach);if(!achReady(a))return;const g=a.g[achTier(a)];S.ach[a.id]=achTier(a)+1;S.gold+=g;sfx.mission();buzz([20,30,20]);flyFrom(b);toast(`${a.n} · +${g} Gold`)}
 else if(b.dataset.bst){const id=b.dataset.bst,bo=BOOST.find(x=>x.id===id);if(S.sel[id])delete S.sel[id];else{const used=BOOST.filter(x=>S.sel[x.id]).reduce((s,x)=>s+x.c,0);if(S.gold<used+bo.c){toast('Nicht genug Gold – es gibt welches für Erfolge und Level',1);sfx.err();return}S.sel[id]=1}sfx.click()}
 else return;
 save();renderHub();
});
function sellLager(b){
 if(S.lager<1)return;const op=oilPrice(),v=Math.floor(S.lager*op.p);S.money+=v;S.earned+=v;mProg('earn',v,true);
 toast(`${big(S.lager)} bbl verkauft · +${fmt(v)}`);S.lager=0;sfx.cash();buzz(20);if(b)flyFrom(b);
}
function flyFrom(el){if(SIM)return;const r=el.getBoundingClientRect(),t=$('uMoney').getBoundingClientRect();for(let i=0;i<6;i++){const f=document.createElement('div');f.className='fly';f.style.left=(r.left+r.width/2)+'px';f.style.top=(r.top+r.height/2)+'px';document.body.appendChild(f);setTimeout(()=>{f.style.left=(t.left+30+i*5)+'px';f.style.top=(t.top+16)+'px';f.style.opacity='0'},20+i*45);setTimeout(()=>f.remove(),900+i*45)}}
$('bSound').onclick=()=>{S.sound=!S.sound;save();updTop();if(S.sound){ac();sfx.coin()}};
function openHub(t){
 state='hub';paused=false;
 if(!G||G.mode!=='idle'||G.reg!==S.reg)newWorld();
 tab=t||(S.tab&&!lockedTab(S.tab)?S.tab:'drill');
 refill();renderHub();show('hub');
}

/* ---------- Abrechnung ---------- */
let countAnim=0;
function settleRun(){
 const op=oilPrice(),oil=Math.round(G.barrels*op.p),total=oil+G.treasure;
 const depth=Math.floor(G.maxDepth),prevBest=S.bestR[G.reg]||0,rec=depth>prevBest&&prevBest>0;
 S.bestR[G.reg]=Math.max(prevBest,depth);S.best=Math.max(S.best,depth);
 S.money+=total;S.runs++;S.earned+=total;S.totalBarrels+=G.barrels;
 S.bestPockets=Math.max(S.bestPockets,G.pockets);S.maxStreak=Math.max(S.maxStreak,G.maxStreak);
 S.avgRun=S.avgRun?S.avgRun*.7+total*.3:total;S.avgBar=S.avgBar?S.avgBar*.7+G.barrels*.3:G.barrels;S.avgPock=S.avgPock?S.avgPock*.7+G.pockets*.3:G.pockets;
 mProg('earn',total,true);
 const xpGain=G.pockets*2+Math.floor(depth/50)+G.newFinds.length*10;
 const xpBefore=S.xp;S.xp+=xpGain;const ups=[];
 while(S.xp>=xpNeed(S.lvl)){S.xp-=xpNeed(S.lvl);S.lvl++;const g=S.lvl%5===0?5:2;S.gold+=g;ups.push({lv:S.lvl,g})}
 if(S.tut<1)S.tut=1;
 save();
 return{op,oil,total,depth,rec,xpGain,ups,xpBefore};
}
const UNLOCK={2:'Ölfeld freigeschaltet: Pumpen und Lager',3:'Booster freigeschaltet',6:'Neue Konzession verfügbar: Arabische Wüste',12:'Neue Konzession verfügbar: Nordsee',18:'Neue Konzession verfügbar: Arktis'};
function showSummary(){
 state='sum';G.fountain=2.5;
 const r=settleRun();
 const icn=G.why==='Diesel leer'?'fuel':G.why==='Bohrkopf kaputt'?'bit':'drill';
 let h=`<div class="phead"><div class="ic">${ic(icn,24)}</div><div><small>Bohrung beendet</small><h2>${G.why}</h2></div></div>`;
 if(r.rec)h+=`<div style="text-align:center"><span class="rec">Neuer Tiefenrekord</span></div>`;
 h+=`<div class="lines"><div><span>Endtiefe</span><b>${r.depth} m</b></div><div><span>${big(G.barrels)} bbl × $${dez(r.op.p,2)}${r.op.boom?' (Spitze)':''}</span><b>${fmt(r.oil)}</b></div>`;
 if(G.tCount)h+=`<div><span>Fundstücke (${G.tCount})</span><b>${fmt(G.treasure)}</b></div>`;
 if(G.maxStreak>1)h+=`<div><span>Lagerstätten ${G.pockets} · beste Serie</span><b>×${dez(1+.2*Math.min(G.maxStreak-1,10))}</b></div>`;
 h+=`</div>`;
 if(G.newFinds.length)h+=`<div>${G.newFinds.map(f=>`<span class="find">Neu im Katalog: ${f.n}</span>`).join('')}</div>`;
 h+=`<div class="totl">Erlös</div><div class="total" id="sTotal">$0</div>`;
 h+=`<div class="xp"><div class="row"><span>LEVEL <b>${S.lvl}</b></span><span>+${big(r.xpGain)} XP</span></div><div class="bar"><div id="xpB" style="width:${r.ups.length?0:r.xpBefore/xpNeed(S.lvl)*100}%"></div></div></div>`;
 for(const u of r.ups)h+=`<div class="lvup">${ic('star',20)}<div><b>LEVEL ${u.lv}</b> · +${u.g} Gold${UNLOCK[u.lv]?'<br>'+UNLOCK[u.lv]:''}</div></div>`;
 const c=cheapestUp(),afford=UPS.some(u=>S.up[u.id]<MAXL&&S.money>=upCost(u,S.up[u.id]));
 h+=`<div class="hint">${afford?'In der Werkstatt ist ein <b>Upgrade verfügbar</b>.':c?`Noch <b>${fmt(c.c-S.money)}</b> bis ${c.u.n} Stufe ${S.up[c.u.id]+1}`:''}</div>`;
 h+=`<div class="row2"><button class="btn sec" id="bShop" style="flex:.85">${ic('wrench',18)}Werkstatt</button><button class="btn" id="bAgain" style="font-size:20px">Erneut bohren</button></div>`;
 $('sumBox').innerHTML=h;
 $('bAgain').onclick=()=>{cancelAnimationFrame(countAnim);startRun()};
 $('bShop').onclick=()=>{cancelAnimationFrame(countAnim);openHub(afford?'shop':undefined)};
 show('sum');
 setTimeout(()=>{const xb=$('xpB');if(xb)xb.style.width=(S.xp/xpNeed(S.lvl)*100)+'%'},400);
 if(r.ups.length)setTimeout(()=>{sfx.level();buzz([30,40,30,40,60])},700);
 const t0=performance.now();cancelAnimationFrame(countAnim);let lastTick=0;
 const step=now=>{const k=Math.min(1,(now-t0)/1000),e=$('sTotal');if(!e)return;e.textContent=fmt(r.total*(1-Math.pow(1-k,3)));if(now-lastTick>80&&k<1){sfx.tick();lastTick=now}if(k<1)countAnim=requestAnimationFrame(step);else if(r.total>0)sfx.cash()};
 countAnim=requestAnimationFrame(step);
}

/* ---------- Tagesbonus & Offline ---------- */
const queue=[];
function info(icn,sub,title,html,btn,cb){queue.push({icn,sub,title,html,btn,cb})}
function nextInfo(){const q=queue.shift();if(!q){openHub();return}$('iIc').innerHTML=ic(q.icn,24);$('iS').textContent=q.sub;$('iT').textContent=q.title;$('iB').innerHTML=q.html;$('bInfo').textContent=q.btn;$('bInfo').onclick=()=>{ac();q.cb&&q.cb();save();sfx.cash();nextInfo()};show('info')}
function dayStr(d){return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}
function idleTick(sec){const cap=lagerCap(S.lagerLv);if(S.pumps&&S.lager<cap)S.lager=Math.min(cap,S.lager+pumpRate()*sec)}
function checkStart(){
 const now=Date.now(),away=Math.max(0,(now-S.seen)/1000);
 if(S.pumps>0&&away>60){
  const before=S.lager;idleTick(away);const got=S.lager-before,cap=lagerCap(S.lagerLv);
  if(got>=1){const tm=away>=3600?Math.floor(away/3600)+' h '+Math.floor(away%3600/60)+' min':Math.floor(away/60)+' min';
   info('pumpjack','Bericht der Förderung','Willkommen zurück',`<div class="lines"><div><span>Abwesenheit</span><b>${tm}</b></div><div><span>Gefördert</span><b>${big(got)} bbl</b></div><div><span>Lagerwert</span><b>${fmt(S.lager*oilPrice().p)}</b></div></div>${S.lager>=cap-.5?`<div class="warn">${ic('warn',15)}Lager voll – die Pumpen stehen still.</div>`:''}`,'Zum Ölfeld',()=>{S.tab='field'})}
 }
 const d=new Date(),today=dayStr(d);
 if(S.lastDay!==today){
  const y=new Date(d);y.setDate(y.getDate()-1);
  S.streak=S.lastDay===dayStr(y)?S.streak+1:1;S.lastDay=today;
  const day=((S.streak-1)%7)+1;
  const amt=Math.max(1000,Math.round(Math.max(S.avgRun,1500)*(.6+.25*day)/10)*10),gold=day===7?5:day===3||day===5?2:1;
  let st='<div class="days">';for(let i=1;i<=7;i++)st+=`<span class="${i<=day?'on':''}">TAG<b>${i}</b></span>`;st+='</div>';
  info('cal',`${S.streak} ${S.streak===1?'Tag':'Tage'} in Folge`,'Tagesbonus',st+`<div class="totl">Prämie</div><div class="total">${fmt(amt)}</div><div class="hint">und <b>${gold} Gold</b> · morgen gibt es mehr</div>`,'Einsammeln',()=>{S.money+=amt;S.gold+=gold});
 }
 save();nextInfo();
}

/* ---------- Eingabe ---------- */
cv.addEventListener('pointerdown',e=>{touch.on=true;touch.x=e.clientX;if(e.cancelable)e.preventDefault()},{passive:false});
cv.addEventListener('pointermove',e=>{if(touch.on)touch.x=e.clientX});
const tup=()=>{touch.on=false};
cv.addEventListener('pointerup',tup);cv.addEventListener('pointercancel',tup);cv.addEventListener('pointerleave',tup);
addEventListener('keydown',e=>{if(state!=='play')return;if(e.code==='ArrowLeft'){touch.on=true;touch.x=0}if(e.code==='ArrowRight'){touch.on=true;touch.x=W}});
addEventListener('keyup',e=>{if(e.code==='ArrowLeft'||e.code==='ArrowRight')touch.on=false});
$('pause').onclick=()=>{if(state==='play'&&G.mode==='run'){paused=true;humStop();show('pauseOv')}};
$('bResume').onclick=()=>{paused=false;show(null);if(G.mode==='run')humStart()};
$('bQuit').onclick=()=>{paused=false;show(null);endRun('Abgebrochen')};
$('bRev').onclick=doRevive;$('bRevNo').onclick=declineRevive;
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();if(state==='play'&&G.mode==='run'&&!paused){paused=true;humStop();show('pauseOv')}}});
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ---------- Schleife ---------- */
let lastT=performance.now(),saveT=0,uiT=0,chartT=0;
function frame(now){
 const dt=Math.min(.033,(now-lastT)/1000);lastT=now;
 if(!SIM){
  idleTick(dt);
  saveT+=dt;if(saveT>5){saveT=0;save()}
  if(state==='hub'){uiT+=dt;chartT+=dt;if(uiT>.25){uiT=0;updTop()}if(chartT>2&&tab==='field'){chartT=0;drawChart()}}
  if(G&&!paused)update(dt);else TT+=dt;
  draw();
 }
 requestAnimationFrame(frame);
}
resize();newWorld();
checkStart();
requestAnimationFrame(frame);

/* ---------- Test-/Balancing-Schnittstelle ---------- */
window.__oel={get G(){return G},get S(){return S},get state(){return state},touch,
 sim:{
  on(){SIM=true},off(){SIM=false},
  reset(){S=JSON.parse(JSON.stringify(DEF));refill()},
  run(bot,maxSec){startRun();let t=0;while(G.mode==='run'&&t<(maxSec||900)){bot(G,touch,W,U);update(1/30);t+=1/30}if(G.mode==='run')finishRun('Zeit');const r=settleRun();r.time=t;r.barrels=G.barrels;r.pockets=G.pockets;r.reg=G.reg;state='hub';return r},
  idle:idleTick,sell:()=>sellLager(null),
  buyUp(id){const u=UPS.find(x=>x.id===id),c=upCost(u,S.up[id]);if(S.up[id]<MAXL&&S.money>=c){S.money-=c;S.up[id]++;return true}return false},
  upCost:id=>upCost(UPS.find(x=>x.id===id),S.up[id]),
  buyPump(){const c=pumpCost(S.pumps);if(S.money>=c){S.money-=c;S.pumps++;return true}return false},pumpCost:()=>pumpCost(S.pumps),
  buyLager(){const c=lagerCost(S.lagerLv);if(S.money>=c){S.money-=c;S.lagerLv++;return true}return false},lagerCost:()=>lagerCost(S.lagerLv),lagerCap:()=>lagerCap(S.lagerLv),pumpRate,
  buyReg(i){const r=REG[i];if(!S.regs.includes(i)&&S.lvl>=r.lv&&S.money>=r.cost){S.money-=r.cost;S.regs.push(i);S.reg=i;return true}return false},
  claimAch(){let g=0;for(const a of ACH)while(achReady(a)){g+=a.g[achTier(a)];S.ach[a.id]=achTier(a)+1}S.gold+=g;return g},
  REG,UPS,refill,xpNeed,
 }};
})();
